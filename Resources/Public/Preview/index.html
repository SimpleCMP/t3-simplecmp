<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SimpleCMP — banner preview</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #f5f7f9;
    font-family: system-ui, sans-serif;
    color: #1a232c;
    height: 100%;
  }
</style>
</head>
<body>
  <script src="../JavaScript/simplecmp.global.js"></script>
  <!--
    Load init.js with the parent URL's query string appended so the
    cache-buster `f:uri.resource` puts on the iframe src (`?<hash>`)
    propagates here. Without it browsers serve a stale init.js across
    extension updates and the editor never sees changes to the demo
    config (services, translations, banner config like `imprint`).
  -->
  <script type="module">
    import('./init.js' + window.location.search);
  </script>
</body>
</html>
