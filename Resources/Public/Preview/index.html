<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SimpleCMP — banner preview</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #f5f7f9;
    font-family: system-ui, sans-serif;
    color: #1a232c;
    height: 100%;
  }
</style>
</head>
<body>
  <!--
    Bundle + init.js are loaded with cache-busting query strings so
    the BE designer's iframe never serves a stale module after the
    extension updates.

    The parent BE module's iframe `src` carries a cache-buster from
    `f:uri.resource` (based on the index.html mtime); we propagate
    that as a baseline. But init.js / simplecmp.global.js can change
    independently of index.html, so we ALSO append a per-load
    timestamp. The timestamp gets serialised once per iframe load,
    not once per page render — that's fine; the BE module reloads
    the iframe on every relevant user action (language switch,
    theme/layout/tone change) which produces a fresh window.

    The bundle is an IIFE (not an ES module), so it loads via a
    dynamically-inserted `<script>` with the buster appended to the
    src URL. init.js IS a module — it loads via dynamic `import()`
    once the bundle has registered `window.SimpleCMP` on the global.
  -->
  <script>
    (function () {
      var parentBuster = window.location.search || '';
      var loadBuster = (parentBuster.indexOf('?') === -1 && parentBuster.indexOf('&') === -1 ? '?' : '&')
        + 'cb=' + Date.now();
      var buster = parentBuster + loadBuster;
      var s = document.createElement('script');
      s.src = '../JavaScript/simplecmp.global.js' + buster;
      s.onload = function () {
        import('./init.js' + buster);
      };
      document.head.appendChild(s);
    })();
  </script>
</body>
</html>
