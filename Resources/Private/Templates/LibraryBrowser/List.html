<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Module" />

<f:section name="Content">
    <f:render partial="ModuleNav" arguments="{active: 'library', uri_detectionsTab: uri_detectionsTab, uri_registryTab: uri_registryTab, uri_libraryTab: uri_libraryTab, uri_trackerSetupTab: uri_trackerSetupTab, uri_auditTab: uri_auditTab, uri_auskunftTab: uri_auskunftTab, uri_settingsTab: uri_settingsTab}" />
    <f:if condition="{draftScope}">
        <f:render partial="DraftBanner" arguments="{lockState: lockState, hasDraft: hasDraft, currentBeUserId: currentBeUserId, scope: draftScope, uri_publish: uri_publish, uri_discard: uri_discard, uri_takeover: uri_takeover, currentUrl: currentUrl}" />
    </f:if>

    <f:render partial="WizardBanner" arguments="{wizardBannerVisible: wizardBannerVisible, wizardBannerSite: wizardBannerSite, uri_wizardStart: uri_wizardStart}" />

    <f:render partial="UpstreamStatus" arguments="{upstreamStatus: upstreamStatus}" />

    <f:if condition="{topRecommended -> f:count()} > 0">
        <div class="callout callout-info mb-3" data-test="recommendations-section">
            <div class="callout-content">
                <h4 class="callout-title">
                    <core:icon identifier="actions-lightbulb-on" size="small" />
                    <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:library.recommended.title" />
                </h4>
                <p class="mb-3">
                    <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:library.recommended.headline"
                                 arguments="{0: recommendationHeadline.entries, 1: recommendationHeadline.detections}" />
                </p>
                <div class="list-group list-group-flush mb-3">
                    <f:for each="{topRecommended}" as="entry">
                        <div class="list-group-item bg-transparent d-flex justify-content-between align-items-center gap-2 py-2">
                            <div class="flex-grow-1 min-w-0">
                                <strong>{entry.name}</strong>
                                <span class="text-body-secondary"> · {entry.vendor}</span>
                                <code class="ms-2 text-body-secondary">{entry.id}</code>
                            </div>
                            <span class="badge badge-success" title="{entry.pillTooltip}">
                                <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:library.recommended.pill"
                                             arguments="{0: entry.pillCount}" />
                            </span>
                            <form method="post" action="{entry.uri_adopt}" class="d-inline mb-0">
                                <button type="submit" class="btn btn-sm btn-primary">
                                    <core:icon identifier="actions-plus" size="small" />
                                    <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:library.action.adopt" />
                                </button>
                            </form>
                        </div>
                    </f:for>
                </div>
                <div class="d-flex justify-content-between align-items-center gap-2 flex-wrap mb-0">
                    <form method="post" action="{uri_bulkAdopt}" class="mb-0">
                        <f:for each="{allRecommendedIds}" as="rid">
                            <input type="hidden" name="serviceIds[]" value="{rid}" />
                        </f:for>
                        <button type="submit" class="btn btn-sm btn-primary">
                            <core:icon identifier="actions-plus" size="small" />
                            <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:library.recommended.adoptAll"
                                         arguments="{0: recommendationHeadline.entries}" />
                        </button>
                    </form>
                    <f:if condition="{recommendationOverflow} > 0">
                        <a href="{uri_seeAllRecommended}">
                            <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:library.recommended.seeAll"
                                         arguments="{0: recommendationHeadline.entries}" />
                            →
                        </a>
                    </f:if>
                </div>
            </div>
        </div>
    </f:if>

    <h1><f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:library.title" /></h1>
    <p class="text-body-secondary">
        <strong>{availableCount}</strong>
        <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:library.header.available" />
        · {adoptedCount}
        <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:library.header.adopted" />
        · {totalCount}
        <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:library.header.total" />
    </p>

    <div class="btn-toolbar mb-3 align-items-center gap-2" role="toolbar">
        <select data-list-filter="status" class="form-select form-select-sm" style="width: auto;"
                aria-label="{f:translate(key: 'LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:library.filter.label')}">
            <f:for each="{statusOptions}" as="opt">
                <option value="{opt}" {f:if(condition: '{opt} == {status}', then: 'selected')}>
                    <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:library.filter.{opt}" />
                </option>
            </f:for>
        </select>

        <input type="text"
               data-list-filter="search"
               value="{search}"
               class="form-control form-control-sm flex-grow-1"
               style="max-width: 26rem;"
               placeholder="{f:translate(key: 'LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:library.search.placeholder')}"
               aria-label="{f:translate(key: 'LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:library.search.placeholder')}"
               maxlength="200" />

        <f:if condition="{filtersActive}">
            <a href="{uri_resetFilters}" class="btn btn-sm btn-link">
                <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:library.search.clear" />
            </a>
        </f:if>
    </div>

    <f:if condition="{entries -> f:count()} == 0">
        <f:then>
            <f:if condition="{filtersActive}">
                <f:then>
                    <div class="callout callout-info">
                        <h4 class="callout-title">
                            <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:library.empty.filtered.title" />
                        </h4>
                        <p class="callout-body">
                            <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:library.empty.filtered.body" />
                        </p>
                    </div>
                </f:then>
                <f:else>
                    <div class="callout callout-info">
                        <p><f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:library.empty" /></p>
                    </div>
                </f:else>
            </f:if>
        </f:then>
        <f:else>
            <!-- Two bulk-action forms live outside the table to avoid
                 nesting inside the per-row unadopt <form>s. JS reads
                 checked rows, splits them by adopted state (data-adopted),
                 appends hidden inputs to the matching form, and submits.
                 Two forms ⇒ two clean POST targets ⇒ no client-side mixing
                 of adopt + unadopt in a single round-trip. -->
            <form method="post" action="{uri_bulkAdopt}" data-bulk-form-adopt class="d-none"></form>
            <form method="post" action="{uri_bulkUnadopt}" data-bulk-form-unadopt class="d-none"></form>
            <div class="btn-toolbar mb-2 align-items-center gap-2" role="toolbar" data-bulk-toolbar>
                <button type="button"
                        class="btn btn-sm btn-primary"
                        data-bulk-submit-adopt
                        data-label-template="{f:translate(key: 'LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:library.bulk.adoptSelectedTemplate')}"
                        disabled>
                    <core:icon identifier="actions-plus" size="small" />
                    <span data-bulk-submit-adopt-label>
                        <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:library.bulk.adoptSelectedEmpty" />
                    </span>
                </button>
                <button type="button"
                        class="btn btn-sm btn-default"
                        data-bulk-submit-unadopt
                        data-label-template="{f:translate(key: 'LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:library.bulk.unadoptSelectedTemplate')}"
                        disabled>
                    <core:icon identifier="actions-minus" size="small" />
                    <span data-bulk-submit-unadopt-label>
                        <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:library.bulk.unadoptSelectedEmpty" />
                    </span>
                </button>
                <button type="button" class="btn btn-sm btn-default" data-bulk-clear disabled>
                    <core:icon identifier="actions-close" size="small" />
                    <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:library.bulk.clearSelection" />
                </button>
            </div>
            <div class="table-fit">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th style="width: 2.5rem;">
                                <input type="checkbox"
                                       data-bulk-select-all
                                       aria-label="{f:translate(key: 'LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:library.bulk.selectAll')}" />
                            </th>
                            <th style="width: 8rem;"><f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:library.column.status" /></th>
                            <th><f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:library.column.id" /></th>
                            <th><f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:library.column.name" /></th>
                            <th><f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:library.column.vendor" /></th>
                            <th><f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:library.column.purposes" /></th>
                            <th style="width: 14rem;"><f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:library.column.actions" /></th>
                        </tr>
                    </thead>
                    <tbody>
                        <f:for each="{entries}" as="entry">
                            <tr>
                                <td>
                                    <!-- Checkbox renders on every row; data-adopted lets the JS
                                         module split selected rows into adopt vs unadopt buckets
                                         and post to the matching form. value carries the
                                         service-id. No .form-check-input class — that Bootstrap
                                         class sets appearance:none and needs a .form-check
                                         parent shell which we don't use here (collapses to 0x0
                                         otherwise — typo3_v14_gotchas memory). -->
                                    <input type="checkbox"
                                           value="{entry.id}"
                                           data-bulk-row
                                           data-adopted="{f:if(condition: entry.adopted, then: '1', else: '0')}"
                                           aria-label="{entry.name}" />
                                </td>
                                <td>
                                    <f:if condition="{entry.adopted}">
                                        <f:then>
                                            <span class="badge badge-success">
                                                <core:icon identifier="actions-check" size="small" />
                                                <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:library.badge.adopted" />
                                            </span>
                                        </f:then>
                                        <f:else>
                                            <span class="badge badge-secondary">
                                                <core:icon identifier="actions-plus" size="small" />
                                                <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:library.badge.available" />
                                            </span>
                                        </f:else>
                                    </f:if>
                                </td>
                                <td><code>{entry.id}</code></td>
                                <td>{entry.name}</td>
                                <td>{entry.vendor}</td>
                                <td>
                                    <f:for each="{entry.purposes}" as="purpose">
                                        <span class="badge badge-info">{purpose}</span>
                                    </f:for>
                                </td>
                                <td>
                                    <f:if condition="{entry.pillCount} > 0">
                                        <span class="badge badge-success me-1"
                                              data-test="recommendation-pill"
                                              title="{entry.pillTooltip}">
                                            <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:library.recommended.pill"
                                                         arguments="{0: entry.pillCount}" />
                                        </span>
                                    </f:if>
                                    <button type="button"
                                            class="btn btn-sm btn-link p-1 me-1"
                                            data-info-trigger
                                            data-info-payload="{entry.infoModalPayload}"
                                            data-label-modal-title="{f:translate(key: 'LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:info.modal.title')}"
                                            data-label-close="{f:translate(key: 'LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:info.modal.close')}"
                                            data-label-section-general="{f:translate(key: 'LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:info.section.general')}"
                                            data-label-section-purposes="{f:translate(key: 'LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:info.section.purposes')}"
                                            data-label-section-matchers="{f:translate(key: 'LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:info.section.matchers')}"
                                            data-label-section-vendor="{f:translate(key: 'LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:info.section.vendor')}"
                                            data-label-field-id="{f:translate(key: 'LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:info.field.id')}"
                                            data-label-field-vendor="{f:translate(key: 'LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:info.field.vendor')}"
                                            data-label-field-privacy-policy="{f:translate(key: 'LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:info.field.privacyPolicy')}"
                                            data-label-field-cookies="{f:translate(key: 'LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:info.field.cookies')}"
                                            data-label-field-origins="{f:translate(key: 'LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:info.field.origins')}"
                                            data-label-field-vendor-address="{f:translate(key: 'LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:info.field.vendorAddress')}"
                                            data-label-field-vendor-optout="{f:translate(key: 'LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:info.field.vendorOptOut')}"
                                            data-label-field-vendor-partner="{f:translate(key: 'LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:info.field.vendorPartner')}"
                                            data-label-field-vendor-description="{f:translate(key: 'LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:info.field.vendorDescription')}"
                                            title="{f:translate(key: 'LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:info.button.title')}">
                                        <core:icon identifier="actions-info-circle" size="small" />
                                    </button>
                                    <f:if condition="{entry.adopted}">
                                        <f:then>
                                            <form method="post" action="{entry.uri_unadopt}" class="d-inline">
                                                <button type="submit" class="btn btn-sm btn-default">
                                                    <core:icon identifier="actions-minus" size="small" />
                                                    <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:library.action.unadopt" />
                                                </button>
                                            </form>
                                            <f:if condition="{entry.uri_edit}">
                                                <a href="{entry.uri_edit}" class="btn btn-sm btn-link" title="{f:translate(key: 'LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:library.action.edit')}">
                                                    <core:icon identifier="actions-open" size="small" />
                                                </a>
                                            </f:if>
                                        </f:then>
                                        <f:else>
                                            <form method="post" action="{entry.uri_adopt}" class="d-inline">
                                                <button type="submit" class="btn btn-sm btn-primary">
                                                    <core:icon identifier="actions-plus" size="small" />
                                                    <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:library.action.adopt" />
                                                </button>
                                            </form>
                                        </f:else>
                                    </f:if>
                                </td>
                            </tr>
                        </f:for>
                    </tbody>
                </table>
            </div>

            <f:if condition="{totalPages} > 1">
                <nav class="d-flex justify-content-between align-items-center mt-3" aria-label="Pagination">
                    <p class="text-body-secondary mb-0">
                        {rangeStart}–{rangeEnd} / {filteredCount}
                    </p>
                    <div class="btn-group btn-group-sm" role="group">
                        <a href="{uri_pageFirst}" class="btn btn-default {f:if(condition: '{currentPage} == 1', then: 'disabled')}">«</a>
                        <a href="{uri_pagePrev}" class="btn btn-default {f:if(condition: '{currentPage} == 1', then: 'disabled')}">‹</a>
                        <span class="btn btn-default disabled">{currentPage} / {totalPages}</span>
                        <a href="{uri_pageNext}" class="btn btn-default {f:if(condition: '{currentPage} == {totalPages}', then: 'disabled')}">›</a>
                        <a href="{uri_pageLast}" class="btn btn-default {f:if(condition: '{currentPage} == {totalPages}', then: 'disabled')}">»</a>
                    </div>
                </nav>
            </f:if>
        </f:else>
    </f:if>
</f:section>
</html>
