<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Module" />

<f:section name="Content">

<f:render partial="ModuleNav" arguments="{
    active: 'trackerSetup',
    uri_detectionsTab: uri_detectionsTab,
    uri_registryTab: uri_registryTab,
    uri_libraryTab: uri_libraryTab,
    uri_trackerSetupTab: uri_trackerSetupTab,
    uri_auditTab: uri_auditTab,
    uri_auskunftTab: uri_auskunftTab
}" />

<f:if condition="{hasSites}">
    <f:then>

        <div class="d-flex align-items-center justify-content-between mb-3">
            <h1 class="mb-0">
                <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:module.trackerSetup.heading" />
            </h1>

            <!--
                Plain `select` driving window.location.assign() with
                pre-built per-site URLs from the controller. An Extbase
                "form method get" would drop the BE-module route token
                on submission, so TYPO3 would re-render the module
                inside a nested chrome and the navigation tabs would
                appear twice.
            -->
            <div class="d-flex align-items-center gap-2">
                <label for="t3simplecmp-tracker-site" class="form-label mb-0 small text-body-secondary">
                    <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:module.trackerSetup.site" />
                </label>
                <select id="t3simplecmp-tracker-site"
                        class="form-select form-select-sm"
                        style="width:auto"
                        onchange="if (this.value) window.location.assign(this.value);">
                    <f:for each="{siteOptions}" as="opt">
                        <option value="{opt.url}" {f:if(condition: '{opt.identifier} == {selectedSite}', then: 'selected')}>{opt.label}</option>
                    </f:for>
                </select>
            </div>
        </div>

        <p class="text-body-secondary">
            <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:module.trackerSetup.intro" />
        </p>

        <div class="callout callout-info mb-4" role="note">
            <h5 class="callout-title">
                <core:icon identifier="actions-lightbulb-on" size="small" />
                <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:module.trackerSetup.tmRecommendation.heading" />
            </h5>
            <p class="mb-1">
                <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:module.trackerSetup.tmRecommendation.body" />
            </p>
            <p class="mb-0 small text-body-secondary">
                <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:module.trackerSetup.tmRecommendation.docsLink" />:
                <code>vendor/simplecmp/t3-simplecmp/docs/decisions/2026-06-08-tag-manager-first.md</code>
            </p>
        </div>

        <div class="panel panel-default mb-4">
            <div class="panel-heading d-flex align-items-center justify-content-between">
                <strong>
                    <core:icon identifier="actions-database-import" size="small" />
                    <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:module.trackerSetup.dbHeading" />
                </strong>

                <div class="dropdown">
                    <button class="btn btn-primary btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <core:icon identifier="actions-add" size="small" />
                        <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:module.trackerSetup.add" />
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <f:for each="{providerOptions}" as="label" key="type">
                            <li>
                                <f:link.action action="new"
                                               arguments="{site: selectedSite, type: type}"
                                               class="dropdown-item">{label}</f:link.action>
                            </li>
                        </f:for>
                    </ul>
                </div>
            </div>
            <div class="panel-body">
                <f:if condition="{dbTrackers}">
                    <f:then>
                        <table class="table table-striped">
                            <thead>
                                <tr>
                                    <th style="width: 1%"></th>
                                    <th><f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:module.trackerSetup.col.provider" /></th>
                                    <th><f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:module.trackerSetup.col.serviceId" /></th>
                                    <th><f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:module.trackerSetup.col.summary" /></th>
                                    <th class="text-end"><f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:module.trackerSetup.col.actions" /></th>
                                </tr>
                            </thead>
                            <tbody>
                                <f:for each="{dbTrackers}" as="row">
                                    <tr>
                                        <td><core:icon identifier="content-text" size="small" /></td>
                                        <td><strong>{row.providerLabel}</strong></td>
                                        <td><code>{row.service_id}</code></td>
                                        <td class="text-body-secondary small">{row.summary}</td>
                                        <td class="text-end">
                                            <f:link.action action="edit"
                                                           arguments="{uid: row.uid}"
                                                           class="btn btn-default btn-sm">
                                                <core:icon identifier="actions-edit" size="small" />
                                            </f:link.action>
                                            <f:form action="delete"
                                                    method="post"
                                                    class="d-inline"
                                                    data-confirm-message="{f:translate(key: 'LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:module.trackerSetup.deleteConfirm')}">
                                                <f:form.hidden name="uid" value="{row.uid}" />
                                                <f:form.hidden name="site" value="{selectedSite}" />
                                                <button type="submit" class="btn btn-default btn-sm">
                                                    <core:icon identifier="actions-delete" size="small" />
                                                </button>
                                            </f:form>
                                        </td>
                                    </tr>
                                </f:for>
                            </tbody>
                        </table>
                    </f:then>
                    <f:else>
                        <div class="text-body-secondary">
                            <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:module.trackerSetup.dbEmpty" />
                        </div>
                    </f:else>
                </f:if>
            </div>
        </div>

        <f:if condition="{yamlTrackers}">
            <div class="panel panel-default mb-3">
                <div class="panel-heading">
                    <strong>
                        <core:icon identifier="actions-document" size="small" />
                        <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:module.trackerSetup.yamlHeading" />
                    </strong>
                </div>
                <div class="panel-body">
                    <p class="text-body-secondary small mb-3">
                        <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:module.trackerSetup.yamlHint" />
                    </p>
                    <table class="table table-sm">
                        <thead>
                            <tr>
                                <th><f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:module.trackerSetup.col.type" /></th>
                                <th><f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:module.trackerSetup.col.serviceId" /></th>
                                <th><f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:module.trackerSetup.col.config" /></th>
                            </tr>
                        </thead>
                        <tbody>
                            <f:for each="{yamlTrackers}" as="row">
                                <tr>
                                    <td><code>{row.type}</code></td>
                                    <td><code>{row.serviceId}</code></td>
                                    <td class="text-body-secondary small">
                                        <f:for each="{row.config}" as="value" key="key" iteration="i">
                                            <code>{key}</code>=<code>{value}</code><f:if condition="!{i.isLast}">, </f:if>
                                        </f:for>
                                    </td>
                                </tr>
                            </f:for>
                        </tbody>
                    </table>
                </div>
            </div>
        </f:if>

    </f:then>
    <f:else>
        <f:be.infobox state="{f:constant(name: 'TYPO3\CMS\Core\Type\ContextualFeedbackSeverity::WARNING')}">
            <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:module.trackerSetup.noSites" />
        </f:be.infobox>
    </f:else>
</f:if>

</f:section>

</html>
