<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Module" />

<f:section name="Content">

<h1>
    <f:if condition="{isNew}">
        <f:then><f:translate key="LLL:EXT:simplecmp/Resources/Private/Language/locallang_mod.xlf:module.trackerSetup.newHeading" /></f:then>
        <f:else><f:translate key="LLL:EXT:simplecmp/Resources/Private/Language/locallang_mod.xlf:module.trackerSetup.editHeading" /></f:else>
    </f:if>
    <small class="text-body-secondary">— {providerLabel}</small>
</h1>

<f:form action="save" method="post" class="t3simplecmp-tracker-form">
    <f:form.hidden name="uid" value="{f:if(condition: uid, then: uid, else: '0')}" />
    <f:form.hidden name="site" value="{site}" />
    <f:form.hidden name="type" value="{type}" />

    <f:for each="{fields}" as="field">
        <div class="mb-3">
            <f:switch expression="{field.kind}">
                <f:case value="bool">
                    <div class="form-check form-switch">
                        <f:form.checkbox name="values[{field.name}]"
                                         id="tracker-field-{field.name}"
                                         class="form-check-input"
                                         value="1"
                                         checked="{f:if(condition: '{values.{field.name}}', then: 1, else: 0)}" />
                        <label class="form-check-label" for="tracker-field-{field.name}">{field.label}</label>
                    </div>
                </f:case>
                <f:case value="enum">
                    <fieldset>
                        <legend class="form-label">
                            {field.label}
                            <f:if condition="{field.required}">
                                <span class="text-danger">*</span>
                            </f:if>
                        </legend>
                        <f:for each="{field.options}" as="option" iteration="optionIteration">
                            <div class="form-check">
                                <f:form.radio name="values[{field.name}]"
                                              id="tracker-field-{field.name}-{option.value}"
                                              class="form-check-input"
                                              value="{option.value}"
                                              checked="{f:if(condition: '{values.{field.name}} == \'{option.value}\'', then: 1, else: '{f:if(condition: \'!{values.{field.name}} && {optionIteration.isFirst}\', then: 1, else: 0)}')}" />
                                <label class="form-check-label" for="tracker-field-{field.name}-{option.value}">
                                    <strong>{option.label}</strong>
                                </label>
                                <f:if condition="{option.help}">
                                    <div class="form-text text-body-secondary small ms-0">{option.help}</div>
                                </f:if>
                            </div>
                        </f:for>
                    </fieldset>
                </f:case>
                <f:defaultCase>
                    <label for="tracker-field-{field.name}" class="form-label">
                        {field.label}
                        <f:if condition="{field.required}">
                            <span class="text-danger">*</span>
                        </f:if>
                    </label>
                    <f:form.textfield name="values[{field.name}]"
                                      id="tracker-field-{field.name}"
                                      class="form-control"
                                      value="{values.{field.name}}"
                                      additionalAttributes="{f:if(condition: '{field.required}', then: '{required: \'required\'}')}" />
                </f:defaultCase>
            </f:switch>
            <f:if condition="{field.help}">
                <div class="form-text text-body-secondary small">{field.help}</div>
            </f:if>
        </div>
    </f:for>

    <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
        <f:link.action action="list" arguments="{site: site}" class="btn btn-default">
            <f:translate key="LLL:EXT:simplecmp/Resources/Private/Language/locallang_mod.xlf:module.trackerSetup.cancel" />
        </f:link.action>
        <button type="submit" class="btn btn-primary">
            <core:icon identifier="actions-save" size="small" />
            <f:translate key="LLL:EXT:simplecmp/Resources/Private/Language/locallang_mod.xlf:module.trackerSetup.save" />
        </button>
    </div>
</f:form>

</f:section>

</html>
