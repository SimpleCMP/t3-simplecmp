<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Module" />

<f:section name="Content">

<f:if condition="{hasSites}">
    <f:then>
        <f:render partial="WizardStepper" arguments="{
            currentStep: 1,
            uri_welcome: uri_welcome,
            uri_tracker: uri_tracker,
            uri_design: uri_design,
            uri_publish: uri_publish
        }" />

        <h1 class="mb-3">
            <core:icon identifier="actions-cog" size="medium" />
            <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:module.wizard.tracker.heading" />
        </h1>
        <p class="text-body-secondary mb-4">
            <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:module.wizard.tracker.intro" />
        </p>

        <f:if condition="{selectedType}">
            <f:then>
                <div class="card mb-4">
                    <div class="card-header">
                        <strong>{providerLabel}</strong>
                        <f:link.action action="tracker"
                                       arguments="{site: selectedSite}"
                                       class="btn btn-sm btn-link float-end">
                            <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:module.wizard.tracker.changeProvider" />
                        </f:link.action>
                    </div>
                    <div class="card-body">
                        <f:form action="saveTracker" controller="SetupWizard" method="post">
                            <f:form.hidden name="site" value="{selectedSite}" />
                            <f:form.hidden name="type" value="{selectedType}" />

                            <f:for each="{fields}" as="field">
                                <div class="mb-3">
                                    <label for="wizard-field-{field.name}" class="form-label">
                                        {field.label}
                                        <f:if condition="{field.required}">
                                            <span class="text-danger" aria-label="required">*</span>
                                        </f:if>
                                    </label>
                                    <f:switch expression="{field.kind}">
                                        <f:case value="bool">
                                            <div class="form-check form-switch">
                                                <input type="checkbox"
                                                       class="form-check-input"
                                                       id="wizard-field-{field.name}"
                                                       name="values[{field.name}]"
                                                       value="1"
                                                       {f:if(condition: '{values.{field.name}} == 1', then: 'checked')} />
                                            </div>
                                        </f:case>
                                        <f:case value="enum">
                                            <select id="wizard-field-{field.name}"
                                                    name="values[{field.name}]"
                                                    class="form-select">
                                                <option value="">—</option>
                                                <f:for each="{field.options}" as="opt">
                                                    <option value="{opt.value}" {f:if(condition: '{values.{field.name}} == {opt.value}', then: 'selected')}>{opt.label}</option>
                                                </f:for>
                                            </select>
                                        </f:case>
                                        <f:defaultCase>
                                            <input type="{f:if(condition: '{field.kind} == \'url\'', then: 'url', else: 'text')}"
                                                   class="form-control"
                                                   id="wizard-field-{field.name}"
                                                   name="values[{field.name}]"
                                                   value="{values.{field.name}}"
                                                   {f:if(condition: field.required, then: 'required')} />
                                        </f:defaultCase>
                                    </f:switch>
                                    <f:if condition="{field.help}">
                                        <div class="form-text">{field.help}</div>
                                    </f:if>
                                </div>
                            </f:for>

                            <div class="d-flex align-items-center justify-content-between mt-4">
                                <f:link.action action="welcome"
                                               arguments="{site: selectedSite}"
                                               class="btn btn-link text-body-secondary">
                                    <core:icon identifier="actions-arrow-left" size="small" />
                                    <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:module.wizard.back" />
                                </f:link.action>
                                <button type="submit" class="btn btn-primary">
                                    <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:module.wizard.tracker.save" />
                                    <core:icon identifier="actions-arrow-right" size="small" />
                                </button>
                            </div>
                        </f:form>
                    </div>
                </div>
            </f:then>
            <f:else>
                <div class="row g-3 mb-4">
                    <f:for each="{providerOptions}" as="label" key="type">
                        <div class="col-md-4">
                            <f:link.action action="tracker"
                                           arguments="{site: selectedSite, type: type}"
                                           class="card h-100 text-decoration-none text-body">
                                <div class="card-body">
                                    <core:icon identifier="actions-cog" size="medium" />
                                    <h5 class="card-title mt-2">{label}</h5>
                                </div>
                            </f:link.action>
                        </div>
                    </f:for>
                    <div class="col-md-4">
                        <f:form action="saveTracker" controller="SetupWizard" method="post" class="h-100">
                            <f:form.hidden name="site" value="{selectedSite}" />
                            <f:form.hidden name="type" value="none" />
                            <button type="submit" class="card h-100 w-100 border-0 bg-transparent text-start">
                                <div class="card-body">
                                    <core:icon identifier="actions-close" size="medium" />
                                    <h5 class="card-title mt-2">
                                        <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:module.wizard.tracker.skip" />
                                    </h5>
                                    <p class="card-text small text-body-secondary mb-0">
                                        <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:module.wizard.tracker.skipBody" />
                                    </p>
                                </div>
                            </button>
                        </f:form>
                    </div>
                </div>

                <div class="mt-3">
                    <f:link.action action="welcome"
                                   arguments="{site: selectedSite}"
                                   class="btn btn-link text-body-secondary">
                        <core:icon identifier="actions-arrow-left" size="small" />
                        <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:module.wizard.back" />
                    </f:link.action>
                </div>
            </f:else>
        </f:if>

    </f:then>
    <f:else>
        <div class="alert alert-warning">
            <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_mod.xlf:module.wizard.noSites" />
        </div>
    </f:else>
</f:if>

</f:section>
</html>
