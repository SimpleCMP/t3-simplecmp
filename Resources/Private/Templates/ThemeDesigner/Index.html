<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Module" />

<f:section name="Content">
    <h1><f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.title" /></h1>
    <p class="text-body-secondary">
        <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.intro" />
    </p>

    <f:if condition="{hasAvailableSites}">
        <f:else>
            <f:be.infobox
                title="{f:translate(key: 'LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.emptyState.title')}"
                state="{f:constant(name: 'TYPO3\CMS\Core\Type\ContextualFeedbackSeverity::WARNING')}">
                <p>
                    <f:translate
                        key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.emptyState.message"
                        arguments="{0: setIdentifier}"/>
                </p>
                <f:if condition="{allSites}">
                    <p class="mb-1">
                        <strong>
                            <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.emptyState.knownSites"/>
                        </strong>
                    </p>
                    <ul class="mb-2">
                        <f:for each="{allSites}" as="siteId">
                            <li><code>config/sites/{siteId}/config.yaml</code></li>
                        </f:for>
                    </ul>
                </f:if>
                <p class="mb-1">
                    <strong>
                        <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.emptyState.howTo"/>
                    </strong>
                </p>
<pre class="mb-0"><code>dependencies:
  - {setIdentifier}</code></pre>
            </f:be.infobox>
        </f:else>

        <f:then>

    <form method="post" action="{uri_save}">
        <input type="hidden" name="site" value="{site}" />

        <div class="d-flex align-items-center mb-3 gap-3">
            <label for="simplecmp-designer-site" class="form-label mb-0">
                <strong><f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.sitePicker.label" /></strong>
            </label>
            <select id="simplecmp-designer-site" class="form-select form-select-sm" style="width:auto"
                    onchange="if (this.value) window.location.assign(this.value);">
                <f:for each="{siteOptions}" as="opt">
                    <option value="{opt.url}" {f:if(condition: '{opt.id} == {site}', then: 'selected')}>{opt.id}</option>
                </f:for>
            </select>
            <f:if condition="{hasLanguageChoice}">
                <label for="simplecmp-designer-language" class="form-label mb-0 ms-3">
                    <strong>
                        <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.languagePicker.label" />
                    </strong>
                </label>
                <select id="simplecmp-designer-language" class="form-select form-select-sm" style="width:auto"
                        data-preview-language-picker
                        data-preview-iframe-base="{f:uri.resource(path: 'Preview/index.html', extensionName: 't3_simplecmp')}">
                    <f:for each="{languageOptions}" as="opt">
                        <option value="{opt.code}" data-href="{opt.url}" {f:if(condition: '{opt.code} == {previewLanguage}', then: 'selected')}>{opt.label}</option>
                    </f:for>
                </select>
            </f:if>
            <f:if condition="{hasCustomTheme}">
                <span class="badge bg-info text-dark">
                    <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.sitePicker.customBadge" />
                </span>
            </f:if>
        </div>

        <div class="row">
            <div class="col-md-6">
                <f:for each="{fieldGroups}" as="fields" key="group">
                    <fieldset class="mb-4">
                        <legend class="h5">
                            <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.group.{group}" />
                        </legend>
                        <f:render section="Fields" arguments="{fields: fields, tokens: tokens}" />
                        <f:if condition="{group} == 'typography'">
                            <div class="mt-2">
                                <button type="button"
                                        class="btn btn-default btn-sm"
                                        data-detect-fonts
                                        data-detect-fonts-url="{siteBaseUrl}">
                                    <core:icon identifier="actions-search" size="small" />
                                    <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.action.detectFonts" />
                                </button>
                                <small class="text-body-secondary ms-2 detect-fonts-status" data-detect-fonts-status></small>
                            </div>
                        </f:if>
                    </fieldset>
                </f:for>
            </div>

            <div class="col-md-6">
                <div class="sticky-top" style="top:1rem">
                    <h5><f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.preview.title" /></h5>
                    <p class="text-body-secondary small mb-2">
                        <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.preview.help" />
                    </p>
                    <!--
                        `f:uri.resource` produces `…/Preview/index.html?<cache-buster>`,
                        so the lang param must be joined with `&`, not `?`. With `?lang=`
                        the URL becomes `?<cb>?lang=de` and the iframe's URLSearchParams
                        parses `<cb>?lang` as the first param name → `lang` is invisible.
                    -->
                    <iframe data-preview-iframe
                            src="{f:uri.resource(path: 'Preview/index.html', extensionName: 't3_simplecmp')}&lang={previewLanguage}"
                            title="{f:translate(key: 'LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.preview.title')}"
                            style="width:100%;height:520px;border:1px solid #dde2e7;border-radius:4px;background:#f5f7f9"
                            sandbox="allow-scripts allow-same-origin"></iframe>
                </div>
            </div>
        </div>

        <div class="btn-toolbar gap-2 mt-3 border-top pt-3">
            <button type="submit" class="btn btn-primary">
                <core:icon identifier="actions-save" size="small" />
                <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.action.save" />
            </button>
            <f:if condition="{hasCustomTheme}">
                <a href="{uri_reset}"
                   class="btn btn-default text-danger"
                   data-confirm-message="{f:translate(key: 'LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.action.reset.confirm')}">
                    <core:icon identifier="actions-undo" size="small" />
                    <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.action.reset" />
                </a>
            </f:if>
        </div>
    </form>

    <datalist id="simplecmp-font-suggestions">
        <option value='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>System UI</option>
        <option value="Arial, Helvetica, sans-serif">Arial / Helvetica</option>
        <option value="Georgia, 'Times New Roman', serif">Georgia</option>
        <option value="'Inter', sans-serif">Inter</option>
        <option value="'Roboto', sans-serif">Roboto</option>
        <option value="'Open Sans', sans-serif">Open Sans</option>
        <option value="'Source Sans Pro', sans-serif">Source Sans Pro</option>
        <option value="'Helvetica Neue', Helvetica, Arial, sans-serif">Helvetica Neue</option>
    </datalist>

        </f:then>
    </f:if>
</f:section>

<f:section name="Fields">
    <f:for each="{fields}" as="key">
        <div class="mb-2">
            <label for="token-{key}" class="form-label">
                <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.field.{key}" />
            </label>
            <f:switch expression="{key}">
                <f:case value="font-family">
                    <input type="text"
                           id="token-{key}"
                           name="tokens[{key}]"
                           value="{tokens.{key}}"
                           class="form-control form-control-sm"
                           list="simplecmp-font-suggestions"
                           data-token="{key}" />
                </f:case>
                <f:case value="font-family-heading">
                    <input type="text"
                           id="token-{key}"
                           name="tokens[{key}]"
                           value="{tokens.{key}}"
                           class="form-control form-control-sm"
                           list="simplecmp-font-suggestions"
                           data-token="{key}" />
                </f:case>
                <f:case value="font-size">
                    <input type="text"
                           id="token-{key}"
                           name="tokens[{key}]"
                           value="{tokens.{key}}"
                           class="form-control form-control-sm"
                           style="width:7rem"
                           pattern="^\d+(\.\d+)?(px|rem|em)$"
                           placeholder="0.95rem"
                           data-token="{key}" />
                </f:case>
                <f:case value="font-size-heading">
                    <input type="text"
                           id="token-{key}"
                           name="tokens[{key}]"
                           value="{tokens.{key}}"
                           class="form-control form-control-sm"
                           style="width:7rem"
                           pattern="^\d+(\.\d+)?(px|rem|em)$"
                           placeholder="20px"
                           data-token="{key}" />
                </f:case>
                <f:case value="radius">
                    <input type="text"
                           id="token-{key}"
                           name="tokens[{key}]"
                           value="{tokens.{key}}"
                           class="form-control form-control-sm"
                           style="width:7rem"
                           pattern="^\d+(\.\d+)?(px|rem|em)$"
                           data-token="{key}" />
                </f:case>
                <f:defaultCase>
                    <div class="d-flex align-items-center gap-2">
                        <input type="color"
                               id="token-{key}"
                               name="tokens[{key}]"
                               value="{tokens.{key}}"
                               class="form-control form-control-color"
                               style="width:2.4rem;height:2.4rem;padding:2px"
                               data-token="{key}" />
                        <code class="text-body-secondary">{tokens.{key}}</code>
                    </div>
                </f:defaultCase>
            </f:switch>
        </div>
    </f:for>
</f:section>

</html>
