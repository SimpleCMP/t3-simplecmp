<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Module" />

<f:section name="Content">
    <style>
        /* 3x3 banner-position picker — radios styled as a 3x3 grid of
           small cells; each cell has a dot indicating where the banner
           would sit within the cell. */
        .simplecmp-position-picker {
            display: grid;
            grid-template-columns: repeat(3, 36px);
            grid-template-rows: repeat(3, 26px);
            gap: 4px;
            padding: 6px;
            background: var(--typo3-component-bg-secondary, #f5f7f9);
            border: 1px solid var(--token-color-stroke-default, #d7d7d7);
            border-radius: 6px;
            width: max-content;
        }
        .simplecmp-position-cell {
            position: relative;
            display: flex;
            border: 1px solid var(--token-color-stroke-default, #d7d7d7);
            border-radius: 3px;
            background: #fff;
            cursor: pointer;
            margin: 0;
            transition: border-color .15s, background .15s;
        }
        .simplecmp-position-cell:hover {
            border-color: var(--typo3-component-primary-color, #0a7cb9);
        }
        .simplecmp-position-cell input {
            position: absolute;
            inset: 0;
            opacity: 0;
            margin: 0;
            cursor: pointer;
        }
        .simplecmp-position-dot {
            position: absolute;
            width: 8px;
            height: 6px;
            border-radius: 1px;
            background: var(--token-color-text-secondary, #5f6b78);
            transition: background .15s;
        }
        .simplecmp-position-cell[data-row="top"]    .simplecmp-position-dot { top: 3px; }
        .simplecmp-position-cell[data-row="middle"] .simplecmp-position-dot { top: 50%; transform: translateY(-50%); }
        .simplecmp-position-cell[data-row="bottom"] .simplecmp-position-dot { bottom: 3px; }
        .simplecmp-position-cell[data-col="left"]   .simplecmp-position-dot { left: 3px; }
        .simplecmp-position-cell[data-col="center"] .simplecmp-position-dot { left: 50%; transform: translateX(-50%); }
        .simplecmp-position-cell[data-col="middle"] .simplecmp-position-dot { left: 50%; transform: translateX(-50%); }
        .simplecmp-position-cell[data-col="right"]  .simplecmp-position-dot { right: 3px; }
        .simplecmp-position-cell[data-row="middle"][data-col="center"] .simplecmp-position-dot {
            top: 50%; left: 50%; transform: translate(-50%, -50%);
        }
        .simplecmp-position-cell:has(input:checked) {
            background: var(--typo3-component-primary-color, #0a7cb9);
            border-color: var(--typo3-component-primary-color, #0a7cb9);
        }
        .simplecmp-position-cell:has(input:checked) .simplecmp-position-dot {
            background: #fff;
        }
    </style>

    <h1><f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.title" /></h1>
    <p class="text-body-secondary">
        <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.intro" />
    </p>

    <!--
        Compliance audit (legal-requirement check) — runs against the
        live site config via `ComplianceCheckService` which mirrors
        the upstream `simplecmp.audit()` engine. Renders only when a
        site is selected. Editors see findings as the first thing
        above the design form so a config that violates a hard
        requirement is obvious before they reach for a color picker.
    -->
    <f:if condition="{hasAvailableSites}">
        <f:if condition="{auditFailed}">
            <f:then>
                <div class="alert alert-{f:if(condition: '{auditWorstSeverity} == \'critical\'', then: 'danger', else: 'warning')} mt-3">
                    <h2 class="h5 mb-2">
                        <core:icon identifier="{f:if(condition: '{auditWorstSeverity} == \'critical\'', then: 'actions-exclamation', else: 'actions-info')}" size="small"/>
                        <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.audit.title"/>
                        <span class="badge text-bg-{f:if(condition: '{auditWorstSeverity} == \'critical\'', then: 'danger', else: 'warning')} ms-2">
                            <f:if condition="{auditCriticalCount}">
                                <f:then>
                                    <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.audit.criticalCount" arguments="{0: auditCriticalCount}"/>
                                </f:then>
                                <f:else>
                                    <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.audit.warningCount" arguments="{0: auditWarningCount}"/>
                                </f:else>
                            </f:if>
                        </span>
                    </h2>
                    <p class="mb-2 small">
                        <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.audit.intro"/>
                    </p>
                    <ul class="list-unstyled mb-0">
                        <f:for each="{auditFailed}" as="finding">
                            <li class="mb-2 d-flex align-items-start gap-2">
                                <span class="badge text-bg-{f:if(condition: '{finding.severity} == \'critical\'', then: 'danger', else: 'warning')} flex-shrink-0">
                                    <f:if condition="{finding.severity} == 'critical'">
                                        <f:then>
                                            <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.audit.severity.critical"/>
                                        </f:then>
                                        <f:else>
                                            <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.audit.severity.warning"/>
                                        </f:else>
                                    </f:if>
                                </span>
                                <div>
                                    <strong>
                                        <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:{finding.titleKey}" default="{finding.id}"/>
                                    </strong>
                                    <a href="{finding.complianceUri}"
                                       target="simplecmp-compliance"
                                       class="ms-1 small text-decoration-none"
                                       title="{f:translate(key: 'LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.audit.sectionLink', arguments: '{0: finding.section}')}">§{finding.section}</a>
                                    <div class="small">
                                        <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:{finding.detailKey}"
                                                     arguments="{0: finding.context.count, 1: finding.context.sample}"
                                                     default="—"/>
                                    </div>
                                </div>
                            </li>
                        </f:for>
                    </ul>
                    <f:if condition="{auditPassed}">
                        <details class="mt-3">
                            <summary class="small text-body-secondary">
                                <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.audit.passedToggle" arguments="{0: '{auditPassed -> f:count()}'}"/>
                            </summary>
                            <ul class="list-unstyled small mt-2 mb-0">
                                <f:for each="{auditPassed}" as="finding">
                                    <li class="mb-1">
                                        <span class="badge text-bg-success me-1">OK</span>
                                        <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:{finding.titleKey}" default="{finding.id}"/>
                                        <a href="{finding.complianceUri}" target="simplecmp-compliance" class="ms-1 text-decoration-none text-body-secondary">§{finding.section}</a>
                                    </li>
                                </f:for>
                            </ul>
                        </details>
                    </f:if>
                </div>
            </f:then>
            <f:else>
                <div class="alert alert-success mt-3">
                    <core:icon identifier="actions-check" size="small"/>
                    <strong>
                        <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.audit.allPassed"/>
                    </strong>
                    <span class="text-body-secondary ms-1 small">
                        <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.audit.allPassedDetail" arguments="{0: '{auditResults -> f:count()}'}"/>
                    </span>
                </div>
            </f:else>
        </f:if>
    </f:if>

    <f:if condition="{hasAvailableSites}">
        <f:else>
            <f:be.infobox
                title="{f:translate(key: 'LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.emptyState.title')}"
                state="{f:constant(name: 'TYPO3\CMS\Core\Type\ContextualFeedbackSeverity::WARNING')}">
                <p>
                    <f:translate
                        key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.emptyState.message"
                        arguments="{0: setIdentifier}"/>
                </p>
                <f:if condition="{allSites}">
                    <p class="mb-1">
                        <strong>
                            <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.emptyState.knownSites"/>
                        </strong>
                    </p>
                    <ul class="mb-2">
                        <f:for each="{allSites}" as="siteId">
                            <li><code>config/sites/{siteId}/config.yaml</code></li>
                        </f:for>
                    </ul>
                </f:if>
                <p class="mb-1">
                    <strong>
                        <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.emptyState.howTo"/>
                    </strong>
                </p>
<pre class="mb-0"><code>dependencies:
  - {setIdentifier}</code></pre>
            </f:be.infobox>
        </f:else>

        <f:then>

    <form method="post" action="{uri_save}">
        <input type="hidden" name="site" value="{site}" />

        <div class="d-flex align-items-center mb-3 gap-3">
            <label for="simplecmp-designer-site" class="form-label mb-0">
                <strong><f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.sitePicker.label" /></strong>
            </label>
            <select id="simplecmp-designer-site" class="form-select form-select-sm" style="width:auto"
                    onchange="if (this.value) window.location.assign(this.value);">
                <f:for each="{siteOptions}" as="opt">
                    <option value="{opt.url}" {f:if(condition: '{opt.id} == {site}', then: 'selected')}>{opt.id}</option>
                </f:for>
            </select>
            <f:if condition="{hasLanguageChoice}">
                <label for="simplecmp-designer-language" class="form-label mb-0 ms-3">
                    <strong>
                        <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.languagePicker.label" />
                    </strong>
                </label>
                <select id="simplecmp-designer-language" class="form-select form-select-sm" style="width:auto"
                        data-preview-language-picker
                        data-preview-iframe-base="{f:uri.resource(path: 'Preview/index.html', extensionName: 't3_simplecmp')}">
                    <f:for each="{languageOptions}" as="opt">
                        <option value="{opt.code}" data-href="{opt.url}" {f:if(condition: '{opt.code} == {previewLanguage}', then: 'selected')}>{opt.label}</option>
                    </f:for>
                </select>
            </f:if>
            <f:if condition="{hasCustomTheme}">
                <span class="badge bg-info text-dark">
                    <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.sitePicker.customBadge" />
                </span>
            </f:if>
        </div>

        <div class="row">
            <div class="col-md-6">
                <f:for each="{fieldGroups}" as="fields" key="group">
                    <fieldset class="mb-4">
                        <legend class="h5">
                            <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.group.{group}" />
                        </legend>
                        <f:render section="Fields" arguments="{fields: fields, tokens: tokens, positionOptions: positionOptions, themeOptions: themeOptions}" />
                        <f:if condition="{group} == 'typography'">
                            <div class="mt-2">
                                <button type="button"
                                        class="btn btn-default btn-sm"
                                        data-detect-fonts
                                        data-detect-fonts-url="{siteBaseUrl}">
                                    <core:icon identifier="actions-search" size="small" />
                                    <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.action.detectFonts" />
                                </button>
                                <small class="text-body-secondary ms-2 detect-fonts-status" data-detect-fonts-status></small>
                            </div>
                        </f:if>
                    </fieldset>
                </f:for>

                <fieldset class="mb-4">
                    <legend class="h5">
                        <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.group.overrides"/>
                    </legend>
                    <p class="text-body-secondary small mb-3">
                        <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.overrides.intro"/>
                    </p>

                    <!--
                        Local language picker inside the override section.
                        Drives the same `?language=` URL as the Vorschau-
                        Sprache picker at the top, so the override scope
                        and the preview language stay in sync — but having
                        a visible selector here makes the active scope
                        obvious without scrolling back to the page header.
                    -->
                    <div class="d-flex flex-wrap align-items-center gap-3 mb-3 p-2 bg-body-tertiary rounded">
                        <f:if condition="{hasLanguageChoice}">
                            <div class="d-flex align-items-center gap-2">
                                <label for="override-lang-picker" class="form-label fw-semibold mb-0">
                                    <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.overrides.scopeLabel"/>
                                </label>
                                <select id="override-lang-picker"
                                        class="form-select form-select-sm"
                                        style="width:auto"
                                        onchange="if (this.value) window.location.assign(this.value);">
                                    <f:for each="{languageOptions}" as="opt">
                                        <option value="{opt.url}" {f:if(condition: '{opt.code} == {overrideLanguage}', then: 'selected')}>{opt.label}</option>
                                    </f:for>
                                </select>
                            </div>
                        </f:if>
                        <!--
                            Tone toggle — Du/Sie etc. Only renders when
                            the upstream bundle ships an informal-tone
                            overlay for the active language (see
                            `LANGUAGES_WITH_INFORMAL_TONE`). The switch
                            sends `tone=informal` (or empty = formal) on
                            save; the FE bundle's own translation engine
                            resolves the preset values at runtime.
                        -->
                        <f:if condition="{hasInformalTone}">
                            <div class="d-flex align-items-center gap-2 ms-md-auto">
                                <span class="form-label fw-semibold mb-0">
                                    <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.overrides.toneLabel"/>:
                                </span>
                                <span class="text-body-secondary small">
                                    <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.overrides.toneFormal"/>
                                </span>
                                <div class="form-check form-switch mb-0">
                                    <input class="form-check-input" type="checkbox" role="switch"
                                           id="override-tone-toggle"
                                           name="tone"
                                           value="informal"
                                           {f:if(condition: '{toneForLang} == \'informal\'', then: 'checked')}/>
                                </div>
                                <span class="text-body-secondary small">
                                    <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.overrides.toneInformal"/>
                                </span>
                            </div>
                        </f:if>
                    </div>

                    <input type="hidden" name="language" value="{overrideLanguage}"/>
                    <f:for each="{overrideKeys}" as="row">
                        <div class="mb-3">
                            <label for="override-{row.key}" class="form-label d-flex align-items-center justify-content-between mb-1">
                                <span class="fw-semibold">
                                    <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.overrides.label.{row.key}" default="{row.key}"/>
                                </span>
                                <f:if condition="{row.value}">
                                    <span class="badge text-bg-info ms-2">
                                        <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.overrides.activeBadge"/>
                                    </span>
                                </f:if>
                            </label>
                            <div class="d-block mb-1">
                                <code class="text-body-secondary small">{row.key}</code>
                            </div>
                            <f:switch expression="{row.kind}">
                                <f:case value="text">
                                    <textarea id="override-{row.key}"
                                              name="overrides[{overrideLanguage}][{row.key}]"
                                              class="form-control form-control-sm"
                                              rows="2"
                                              placeholder="{f:translate(key: 'LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.overrides.placeholder')}">{row.value}</textarea>
                                </f:case>
                                <f:defaultCase>
                                    <input type="text"
                                           id="override-{row.key}"
                                           name="overrides[{overrideLanguage}][{row.key}]"
                                           value="{row.value}"
                                           class="form-control form-control-sm"
                                           placeholder="{f:translate(key: 'LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.overrides.placeholder')}"/>
                                </f:defaultCase>
                            </f:switch>
                        </div>
                    </f:for>
                </fieldset>
            </div>

            <div class="col-md-6">
                <div class="sticky-top" style="top:1rem">
                    <h5><f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.preview.title" /></h5>
                    <p class="text-body-secondary small mb-2">
                        <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.preview.help" />
                    </p>
                    <!--
                        `f:uri.resource` produces `…/Preview/index.html?<cache-buster>`,
                        so the lang/privacy/imprint params must be joined with `&`,
                        not `?`. With `?lang=` the URL becomes `?<cb>?lang=de` and the
                        iframe's URLSearchParams parses `<cb>?lang` as the first param
                        name → `lang` is invisible.
                    -->
                    <iframe data-preview-iframe
                            src="{f:uri.resource(path: 'Preview/index.html', extensionName: 't3_simplecmp')}&lang={previewLanguage}&tone={toneForLang}&theme={tokens.theme}&privacy={policyUrls.privacy -> f:format.urlencode()}&imprint={policyUrls.imprint -> f:format.urlencode()}&overrides={overridesEncoded}"
                            title="{f:translate(key: 'LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.preview.title')}"
                            style="width:100%;height:520px;border:1px solid #dde2e7;border-radius:4px;background:#f5f7f9"
                            sandbox="allow-scripts allow-same-origin"></iframe>

                    <div class="alert alert-{f:if(condition: '{policyUrls.hasPrivacy} && {policyUrls.hasImprint}', then: 'info', else: 'warning')} mt-3 mb-0 py-2 small">
                        <strong class="d-block mb-1">
                            <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.policyUrls.heading"/>
                        </strong>
                        <div class="d-flex flex-column gap-1">
                            <div>
                                <span class="text-body-secondary">
                                    <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.policyUrls.privacy"/>:
                                </span>
                                <f:if condition="{policyUrls.hasPrivacy}">
                                    <f:then><code>{policyUrls.privacy}</code></f:then>
                                    <f:else><em class="text-warning"><f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.policyUrls.unset"/></em></f:else>
                                </f:if>
                            </div>
                            <div>
                                <span class="text-body-secondary">
                                    <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.policyUrls.imprint"/>:
                                </span>
                                <f:if condition="{policyUrls.hasImprint}">
                                    <f:then><code>{policyUrls.imprint}</code></f:then>
                                    <f:else><em class="text-warning"><f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.policyUrls.unset"/></em></f:else>
                                </f:if>
                            </div>
                        </div>
                        <f:if condition="{siteSettingsUri}">
                            <a href="{siteSettingsUri}" class="btn btn-default btn-sm mt-2">
                                <core:icon identifier="actions-open" size="small"/>
                                <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.policyUrls.editAction"/>
                            </a>
                        </f:if>
                    </div>
                </div>
            </div>
        </div>

        <div class="btn-toolbar gap-2 mt-3 border-top pt-3">
            <button type="submit" class="btn btn-primary">
                <core:icon identifier="actions-save" size="small" />
                <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.action.save" />
            </button>
            <f:if condition="{hasCustomTheme}">
                <a href="{uri_reset}"
                   class="btn btn-default text-danger"
                   data-confirm-message="{f:translate(key: 'LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.action.reset.confirm')}">
                    <core:icon identifier="actions-undo" size="small" />
                    <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.action.reset" />
                </a>
            </f:if>
        </div>
    </form>

    <datalist id="simplecmp-font-suggestions">
        <option value='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>System UI</option>
        <option value="Arial, Helvetica, sans-serif">Arial / Helvetica</option>
        <option value="Georgia, 'Times New Roman', serif">Georgia</option>
        <option value="'Inter', sans-serif">Inter</option>
        <option value="'Roboto', sans-serif">Roboto</option>
        <option value="'Open Sans', sans-serif">Open Sans</option>
        <option value="'Source Sans Pro', sans-serif">Source Sans Pro</option>
        <option value="'Helvetica Neue', Helvetica, Arial, sans-serif">Helvetica Neue</option>
    </datalist>

        </f:then>
    </f:if>
</f:section>

<f:section name="Fields">
    <f:for each="{fields}" as="key">
        <div class="mb-2">
            <label for="token-{key}" class="form-label">
                <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.field.{key}" />
            </label>
            <f:switch expression="{key}">
                <f:case value="font-family">
                    <input type="text"
                           id="token-{key}"
                           name="tokens[{key}]"
                           value="{tokens.{key}}"
                           class="form-control form-control-sm"
                           list="simplecmp-font-suggestions"
                           data-token="{key}" />
                </f:case>
                <f:case value="font-family-heading">
                    <input type="text"
                           id="token-{key}"
                           name="tokens[{key}]"
                           value="{tokens.{key}}"
                           class="form-control form-control-sm"
                           list="simplecmp-font-suggestions"
                           data-token="{key}" />
                </f:case>
                <f:case value="font-size">
                    <input type="text"
                           id="token-{key}"
                           name="tokens[{key}]"
                           value="{tokens.{key}}"
                           class="form-control form-control-sm"
                           style="width:7rem"
                           pattern="^\d+(\.\d+)?(px|rem|em)$"
                           placeholder="0.95rem"
                           data-token="{key}" />
                </f:case>
                <f:case value="font-size-heading">
                    <input type="text"
                           id="token-{key}"
                           name="tokens[{key}]"
                           value="{tokens.{key}}"
                           class="form-control form-control-sm"
                           style="width:7rem"
                           pattern="^\d+(\.\d+)?(px|rem|em)$"
                           placeholder="20px"
                           data-token="{key}" />
                </f:case>
                <f:case value="radius">
                    <input type="text"
                           id="token-{key}"
                           name="tokens[{key}]"
                           value="{tokens.{key}}"
                           class="form-control form-control-sm"
                           style="width:7rem"
                           pattern="^\d+(\.\d+)?(px|rem|em)$"
                           data-token="{key}" />
                </f:case>
                <f:case value="position">
                    <div class="simplecmp-position-picker" role="radiogroup"
                         aria-label="{f:translate(key: 'LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.field.position')}">
                        <f:for each="{positionOptions}" as="opt">
                            <label class="simplecmp-position-cell" data-row="{opt.vRow}" data-col="{opt.vCol}"
                                   style="grid-row:{opt.row};grid-column:{opt.col}"
                                   title="{opt.label}">
                                <input type="radio"
                                       name="tokens[position]"
                                       value="{opt.key}"
                                       data-token="position"
                                       {f:if(condition: '{tokens.position} == {opt.key}', then: 'checked')}
                                       aria-label="{opt.label}" />
                                <span class="simplecmp-position-dot"></span>
                            </label>
                        </f:for>
                    </div>
                </f:case>
                <f:case value="theme">
                    <select id="token-{key}"
                            name="tokens[{key}]"
                            class="form-select form-select-sm"
                            data-token="{key}"
                            style="max-width:24rem">
                        <f:for each="{themeOptions}" as="opt">
                            <option value="{opt.key}" {f:if(condition: '{tokens.theme} == {opt.key}', then: 'selected')}>{opt.label}</option>
                        </f:for>
                    </select>
                    <small class="d-block text-body-secondary mt-1">
                        <f:translate key="LLL:EXT:t3_simplecmp/Resources/Private/Language/locallang_design.xlf:designer.field.theme.hint" />
                    </small>
                </f:case>
                <f:defaultCase>
                    <div class="d-flex align-items-center gap-2">
                        <input type="color"
                               id="token-{key}"
                               name="tokens[{key}]"
                               value="{tokens.{key}}"
                               class="form-control form-control-color"
                               style="width:2.4rem;height:2.4rem;padding:2px"
                               data-token="{key}" />
                        <code class="text-body-secondary">{tokens.{key}}</code>
                    </div>
                </f:defaultCase>
            </f:switch>
        </div>
    </f:for>
</f:section>

</html>
