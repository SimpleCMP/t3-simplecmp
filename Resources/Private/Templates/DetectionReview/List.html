<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Module" />

<f:section name="Content">
    <h1><f:translate key="LLL:EXT:simplecmp_typo3/Resources/Private/Language/locallang_mod.xlf:list.title" /></h1>
    <p class="text-body-secondary">
        <strong>{unreviewedCount}</strong> / {totalCount}
        <f:translate key="LLL:EXT:simplecmp_typo3/Resources/Private/Language/locallang_mod.xlf:list.filter.unreviewed" />
    </p>

    <f:if condition="{spikeAlert}">
        <div class="alert alert-warning d-flex align-items-start gap-2" role="alert">
            <core:icon identifier="actions-exclamation-triangle" size="medium" />
            <div>
                <strong><f:translate key="LLL:EXT:simplecmp_typo3/Resources/Private/Language/locallang_mod.xlf:list.spike.title" /></strong>
                <div>
                    <f:translate key="LLL:EXT:simplecmp_typo3/Resources/Private/Language/locallang_mod.xlf:list.spike.body" arguments="{0: todayCount, 1: sevenDayAverage}" />
                </div>
            </div>
        </div>
    </f:if>

    <f:if condition="{secretMissing}">
        <f:then>
            <div class="callout callout-warning mb-3">
                <div class="callout-content">
                    <h4 class="callout-title">
                        <f:translate key="LLL:EXT:simplecmp_typo3/Resources/Private/Language/locallang_mod.xlf:bridgeSecret.disabled.title" />
                    </h4>
                    <p class="callout-body">
                        <f:translate key="LLL:EXT:simplecmp_typo3/Resources/Private/Language/locallang_mod.xlf:bridgeSecret.disabled.body" />
                    </p>
                    <form method="post" action="{uri_generateBridgeSecret}">
                        <button type="submit" class="btn btn-primary">
                            <core:icon identifier="actions-add" size="small" />
                            <f:translate key="LLL:EXT:simplecmp_typo3/Resources/Private/Language/locallang_mod.xlf:bridgeSecret.generate" />
                        </button>
                    </form>
                </div>
            </div>
        </f:then>
        <f:else>
            <p class="mb-3">
                <button type="button" class="btn btn-success" disabled
                        title="{f:translate(key: 'LLL:EXT:simplecmp_typo3/Resources/Private/Language/locallang_mod.xlf:bridgeSecret.configured.tooltip')}">
                    <core:icon identifier="actions-check" size="small" />
                    <f:translate key="LLL:EXT:simplecmp_typo3/Resources/Private/Language/locallang_mod.xlf:bridgeSecret.configured" />
                </button>
            </p>
        </f:else>
    </f:if>

    <div class="btn-toolbar mb-3 align-items-center gap-2" role="toolbar">
        <select data-list-filter="status" class="form-select form-select-sm" style="width:auto"
                aria-label="{f:translate(key: 'LLL:EXT:simplecmp_typo3/Resources/Private/Language/locallang_mod.xlf:filter.status.label')}">
            <f:for each="{statusOptions}" as="opt">
                <option value="{opt}" {f:if(condition: '{opt} == {status}', then: 'selected')}>
                    <f:translate key="LLL:EXT:simplecmp_typo3/Resources/Private/Language/locallang_mod.xlf:filter.status.{opt}" />
                </option>
            </f:for>
        </select>
        <select data-list-filter="source" class="form-select form-select-sm" style="width:auto"
                aria-label="{f:translate(key: 'LLL:EXT:simplecmp_typo3/Resources/Private/Language/locallang_mod.xlf:filter.source.label')}">
            <option value="" {f:if(condition: '{source} == \'\'', then: 'selected')}>
                <f:translate key="LLL:EXT:simplecmp_typo3/Resources/Private/Language/locallang_mod.xlf:filter.source.all" />
            </option>
            <f:for each="{sourceOptions}" as="opt">
                <option value="{opt}" {f:if(condition: '{opt} == {source}', then: 'selected')}>{opt}</option>
            </f:for>
        </select>
        <select data-list-filter="kind" class="form-select form-select-sm" style="width:auto"
                aria-label="{f:translate(key: 'LLL:EXT:simplecmp_typo3/Resources/Private/Language/locallang_mod.xlf:filter.kind.label')}">
            <option value="" {f:if(condition: '{kind} == \'\'', then: 'selected')}>
                <f:translate key="LLL:EXT:simplecmp_typo3/Resources/Private/Language/locallang_mod.xlf:filter.kind.all" />
            </option>
            <f:for each="{kindOptions}" as="opt">
                <option value="{opt}" {f:if(condition: '{opt} == {kind}', then: 'selected')}>
                    <f:translate key="LLL:EXT:simplecmp_typo3/Resources/Private/Language/locallang_mod.xlf:filter.kind.{opt}" />
                </option>
            </f:for>
        </select>
        <select data-list-filter="confidence" class="form-select form-select-sm" style="width:auto"
                aria-label="{f:translate(key: 'LLL:EXT:simplecmp_typo3/Resources/Private/Language/locallang_mod.xlf:filter.confidence.label')}">
            <option value="" {f:if(condition: '{confidence} == \'\'', then: 'selected')}>
                <f:translate key="LLL:EXT:simplecmp_typo3/Resources/Private/Language/locallang_mod.xlf:filter.confidence.all" />
            </option>
            <f:for each="{confidenceOptions}" as="opt">
                <option value="{opt}" {f:if(condition: '{opt} == {confidence}', then: 'selected')}>
                    <f:translate key="LLL:EXT:simplecmp_typo3/Resources/Private/Language/locallang_mod.xlf:filter.confidence.{opt}" />
                </option>
            </f:for>
        </select>
        <div class="btn-group ms-auto" role="group">
            <form method="post"
                  action="{uri_bulkDeleteReviewed}"
                  class="d-inline"
                  data-confirm-message="{f:translate(key: 'LLL:EXT:simplecmp_typo3/Resources/Private/Language/locallang_mod.xlf:list.action.bulkDeleteReviewed.confirm')}">
                <button type="submit"
                        class="btn btn-danger"
                        style="border-top-right-radius:0;border-bottom-right-radius:0">
                    <core:icon identifier="actions-delete" size="small" />
                    <f:translate key="LLL:EXT:simplecmp_typo3/Resources/Private/Language/locallang_mod.xlf:list.action.bulkDeleteReviewed" />
                </button>
            </form>
            <button type="button"
                    class="btn btn-danger dropdown-toggle dropdown-toggle-split"
                    data-bs-toggle="dropdown"
                    aria-expanded="false">
                <span class="visually-hidden">
                    <f:translate key="LLL:EXT:simplecmp_typo3/Resources/Private/Language/locallang_mod.xlf:list.action.moreDeleteOptions" />
                </span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li>
                    <button type="submit"
                            form="simplecmp-bulk-select-form"
                            class="dropdown-item text-danger"
                            data-bulk-select-trigger
                            disabled>
                        <core:icon identifier="actions-delete" size="small" />
                        <f:translate key="LLL:EXT:simplecmp_typo3/Resources/Private/Language/locallang_mod.xlf:list.action.bulkDeleteSelected" />
                        <span class="badge bg-secondary ms-1" data-bulk-select-count>0</span>
                    </button>
                </li>
                <li><hr class="dropdown-divider" /></li>
                <li>
                    <form method="post"
                          action="{uri_bulkDeleteAll}"
                          class="m-0"
                          data-confirm-message="{f:translate(key: 'LLL:EXT:simplecmp_typo3/Resources/Private/Language/locallang_mod.xlf:list.action.bulkDeleteAll.confirm')}">
                        <button type="submit" class="dropdown-item text-danger">
                            <core:icon identifier="actions-delete" size="small" />
                            <f:translate key="LLL:EXT:simplecmp_typo3/Resources/Private/Language/locallang_mod.xlf:list.action.bulkDeleteAll" />
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>

    <f:if condition="{detections -> f:count()} > 0">
        <f:then>
            <div class="d-flex align-items-center mb-2 gap-3">
                <div class="d-flex align-items-center gap-2">
                    <label for="simplecmp-per-page" class="form-label mb-0 text-body-secondary small">
                        <f:translate key="LLL:EXT:simplecmp_typo3/Resources/Private/Language/locallang_mod.xlf:list.pagination.perPageLabel" />
                    </label>
                    <select id="simplecmp-per-page" data-per-page class="form-select form-select-sm" style="width:auto">
                        <f:for each="{perPageOptions}" as="option">
                            <option value="{option}" {f:if(condition: '{option} == {perPage}', then: 'selected')}>{option}</option>
                        </f:for>
                    </select>
                </div>
                <div class="text-body-secondary small ms-auto">
                    <f:translate key="LLL:EXT:simplecmp_typo3/Resources/Private/Language/locallang_mod.xlf:list.pagination.range" arguments="{0: rangeStart, 1: rangeEnd, 2: filteredCount}" />
                </div>
            </div>

            <form id="simplecmp-bulk-select-form"
                  method="post"
                  action="{uri_bulkDeleteSelected}"
                  data-confirm-message="{f:translate(key: 'LLL:EXT:simplecmp_typo3/Resources/Private/Language/locallang_mod.xlf:list.action.bulkDeleteSelected.confirm')}">
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th class="col-checkbox">
                            <input type="checkbox"
                                   data-bulk-select-all
                                   aria-label="{f:translate(key: 'LLL:EXT:simplecmp_typo3/Resources/Private/Language/locallang_mod.xlf:list.col.selectAll')}" />
                        </th>
                        <th><f:translate key="LLL:EXT:simplecmp_typo3/Resources/Private/Language/locallang_mod.xlf:list.col.kind" /></th>
                        <th><f:translate key="LLL:EXT:simplecmp_typo3/Resources/Private/Language/locallang_mod.xlf:list.col.identifier" /></th>
                        <th><f:translate key="LLL:EXT:simplecmp_typo3/Resources/Private/Language/locallang_mod.xlf:list.col.origin" /></th>
                        <th class="text-end"><f:translate key="LLL:EXT:simplecmp_typo3/Resources/Private/Language/locallang_mod.xlf:list.col.occurrences" /></th>
                        <th><f:translate key="LLL:EXT:simplecmp_typo3/Resources/Private/Language/locallang_mod.xlf:list.col.received" /></th>
                        <th><f:translate key="LLL:EXT:simplecmp_typo3/Resources/Private/Language/locallang_mod.xlf:list.col.source" /></th>
                        <th><f:translate key="LLL:EXT:simplecmp_typo3/Resources/Private/Language/locallang_mod.xlf:list.col.reviewed" /></th>
                        <th class="text-end"><f:translate key="LLL:EXT:simplecmp_typo3/Resources/Private/Language/locallang_mod.xlf:list.col.actions" /></th>
                    </tr>
                </thead>
                <tbody>
                    <f:for each="{detections}" as="detection">
                        <tr>
                            <td class="col-checkbox">
                                <input type="checkbox"
                                       name="uids[]"
                                       value="{detection.uid}"
                                       data-bulk-select-row
                                       aria-label="{f:translate(key: 'LLL:EXT:simplecmp_typo3/Resources/Private/Language/locallang_mod.xlf:list.col.selectRow')}" />
                            </td>
                            <td><span class="badge bg-secondary">{detection.kind}</span></td>
                            <td><code>{detection.identifier}</code></td>
                            <td><f:if condition="{detection.origin}"><code>{detection.origin}</code></f:if></td>
                            <td class="text-end">
                                <span class="badge {detection.confidence_class}"
                                      title="{f:translate(key: 'LLL:EXT:simplecmp_typo3/Resources/Private/Language/locallang_mod.xlf:list.confidence.tooltip')}">
                                    {detection.occurrences}
                                </span>
                            </td>
                            <td>
                                <f:format.date format="Y-m-d H:i">{detection.received_at}</f:format.date>
                            </td>
                            <td><span class="text-body-secondary">{detection.source}</span></td>
                            <td>
                                <f:if condition="{detection.reviewed}">
                                    <f:then><span class="badge bg-success">✓</span></f:then>
                                    <f:else><span class="badge bg-warning">●</span></f:else>
                                </f:if>
                            </td>
                            <td class="text-end">
                                <div class="btn-group btn-group-sm" role="group">
                                    <a href="{detection.uri_show}"
                                       class="btn btn-default"
                                       title="{f:translate(key: 'LLL:EXT:simplecmp_typo3/Resources/Private/Language/locallang_mod.xlf:list.action.show')}">
                                        <core:icon identifier="actions-document-view" size="small" />
                                        <f:translate key="LLL:EXT:simplecmp_typo3/Resources/Private/Language/locallang_mod.xlf:list.action.show" />
                                    </a>
                                    <a href="{detection.uri_createService}"
                                       class="btn btn-primary"
                                       data-confirm-message="{detection.low_confidence_confirm}"
                                       title="{f:translate(key: 'LLL:EXT:simplecmp_typo3/Resources/Private/Language/locallang_mod.xlf:list.action.createService')}">
                                        <core:icon identifier="actions-plus" size="small" />
                                        <f:translate key="LLL:EXT:simplecmp_typo3/Resources/Private/Language/locallang_mod.xlf:list.action.createService" />
                                    </a>
                                    <f:if condition="{detection.reviewed}">
                                        <f:then>
                                            <a href="{detection.uri_unmarkReviewed}" class="btn btn-default">
                                                <core:icon identifier="actions-close" size="small" />
                                                <f:translate key="LLL:EXT:simplecmp_typo3/Resources/Private/Language/locallang_mod.xlf:list.action.unmarkReviewed" />
                                            </a>
                                        </f:then>
                                        <f:else>
                                            <a href="{detection.uri_markReviewed}" class="btn btn-success">
                                                <core:icon identifier="actions-check" size="small" />
                                                <f:translate key="LLL:EXT:simplecmp_typo3/Resources/Private/Language/locallang_mod.xlf:list.action.markReviewed" />
                                            </a>
                                        </f:else>
                                    </f:if>
                                    <a href="{detection.uri_delete}"
                                       class="btn btn-default text-danger"
                                       data-confirm-message="{f:translate(key: 'LLL:EXT:simplecmp_typo3/Resources/Private/Language/locallang_mod.xlf:list.action.delete.confirm')}"
                                       title="{f:translate(key: 'LLL:EXT:simplecmp_typo3/Resources/Private/Language/locallang_mod.xlf:list.action.delete')}">
                                        <core:icon identifier="actions-delete" size="small" />
                                    </a>
                                </div>
                            </td>
                        </tr>
                    </f:for>
                </tbody>
            </table>
            </form>

            <f:if condition="{totalPages} > 1">
                <nav aria-label="{f:translate(key: 'LLL:EXT:simplecmp_typo3/Resources/Private/Language/locallang_mod.xlf:list.pagination.nav')}">
                    <ul class="pagination pagination-sm justify-content-end">
                        <li class="page-item {f:if(condition: '{currentPage} == 1', then: 'disabled')}">
                            <a class="page-link" href="{uri_pageFirst}" aria-label="First">«</a>
                        </li>
                        <li class="page-item {f:if(condition: '{currentPage} == 1', then: 'disabled')}">
                            <a class="page-link" href="{uri_pagePrev}" aria-label="Previous">‹</a>
                        </li>
                        <li class="page-item disabled">
                            <span class="page-link">
                                <f:translate key="LLL:EXT:simplecmp_typo3/Resources/Private/Language/locallang_mod.xlf:list.pagination.pageOf" arguments="{0: currentPage, 1: totalPages}" />
                            </span>
                        </li>
                        <li class="page-item {f:if(condition: '{currentPage} == {totalPages}', then: 'disabled')}">
                            <a class="page-link" href="{uri_pageNext}" aria-label="Next">›</a>
                        </li>
                        <li class="page-item {f:if(condition: '{currentPage} == {totalPages}', then: 'disabled')}">
                            <a class="page-link" href="{uri_pageLast}" aria-label="Last">»</a>
                        </li>
                    </ul>
                </nav>
            </f:if>
        </f:then>
        <f:else>
            <f:if condition="{filtersActive} && {totalCount} > 0">
                <f:then>
                    <div class="callout callout-info">
                        <div class="callout-content">
                            <h4 class="callout-title">
                                <f:translate key="LLL:EXT:simplecmp_typo3/Resources/Private/Language/locallang_mod.xlf:list.empty.filtered.title" />
                            </h4>
                            <f:if condition="{filterDropHints -> f:count()} > 0">
                                <p class="callout-body mb-2">
                                    <f:translate key="LLL:EXT:simplecmp_typo3/Resources/Private/Language/locallang_mod.xlf:list.empty.filtered.body" />
                                </p>
                            </f:if>
                            <div class="d-flex flex-wrap gap-2">
                                <f:for each="{filterDropHints}" as="hint">
                                    <a href="{hint.uri}" class="btn btn-default btn-sm">
                                        <f:translate key="LLL:EXT:simplecmp_typo3/Resources/Private/Language/locallang_mod.xlf:list.empty.filtered.drop.{hint.name}" arguments="{0: hint.count}" />
                                    </a>
                                </f:for>
                                <a href="{uri_resetFilters}" class="btn btn-default btn-sm">
                                    <core:icon identifier="actions-close" size="small" />
                                    <f:translate key="LLL:EXT:simplecmp_typo3/Resources/Private/Language/locallang_mod.xlf:list.empty.filtered.reset" />
                                </a>
                            </div>
                        </div>
                    </div>
                </f:then>
                <f:else>
                    <div class="callout callout-info">
                        <div class="callout-content">
                            <f:translate key="LLL:EXT:simplecmp_typo3/Resources/Private/Language/locallang_mod.xlf:list.empty" />
                        </div>
                    </div>
                </f:else>
            </f:if>
        </f:else>
    </f:if>
</f:section>

</html>
