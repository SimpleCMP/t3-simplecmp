services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  _instanceof:
    # Auto-tag every bundled / third-party tracker provider so the
    # registry collects them via the !tagged_iterator below.
    SimpleCMP\T3SimpleCmp\Tracker\TrackerProviderInterface:
      tags: ['simplecmp.tracker_provider']

  SimpleCMP\T3SimpleCmp\:
    resource: '../Classes/*'

  SimpleCMP\T3SimpleCmp\Tracker\TrackerRegistry:
    arguments:
      $providers: !tagged_iterator simplecmp.tracker_provider

  SimpleCMP\T3SimpleCmp\Command\GenerateBridgeSecretCommand:
    tags:
      - name: 'console.command'
        command: 'simplecmp:generate-bridge-secret'
        description: 'Generate a fresh HMAC secret for the SimpleCMP bridge webhook nonces.'

  SimpleCMP\T3SimpleCmp\Command\SnapshotConfigCommand:
    tags:
      - name: 'console.command'
        command: 'simplecmp:snapshot-config'
        description: 'Capture an audit snapshot of the current SimpleCMP banner configuration (idempotent — dedupes by canonical-content hash). Use after YAML-only edits or as a pre-deployment freeze checkpoint.'

  SimpleCMP\T3SimpleCmp\Command\AuditRetentionCommand:
    tags:
      - name: 'console.command'
        command: 'simplecmp:audit-retention'
        description: 'Apply DSGVO retention to the SimpleCMP audit tables. Writes a self-audit log of every invocation (including dry-runs). Requires --target, --keep-days, --reason, --i-know-what-i-do.'

  SimpleCMP\T3SimpleCmp\Command\ExportAuditCommand:
    tags:
      - name: 'console.command'
        command: 'simplecmp:export-audit'
        description: 'Export an audit bundle (snapshots + decisions) for one filter: --snapshot=<hash>, --visitor=<uuid>, --visitor-hash=<sha256>, or --since=<YYYY-MM-DD>. JSON or CSV.'

  # PSR-15 middlewares: TYPO3 instantiates these via `makeInstance`, which
  # only reads from public services in the DI container. Without `public:
  # true` the autowired constructor args (repositories) silently fail and
  # the middleware crashes with "Too few arguments to __construct".
  SimpleCMP\T3SimpleCmp\Middleware\ServiceDbApi:
    public: true

  # ADR-0013 — universal-blocking HTML rewriter (Phase 0 prototype).
  SimpleCMP\T3SimpleCmp\UniversalBlocking\Middleware\HtmlRewriter:
    public: true

  # DataHandler hooks are pulled via GeneralUtility::makeInstance() and
  # need autowiring of the snapshot listener — mark both as public so
  # they resolve through the DI container with their dependencies.
  SimpleCMP\T3SimpleCmp\Hooks\DataHandler\SnapshotConfigOnSave:
    public: true
  SimpleCMP\T3SimpleCmp\Service\ConfigSnapshotListener:
    public: true

  # Phase 4 — draft workspace orchestrator. Public so functional tests
  # can `$this->get()` it; production usage is via controller DI.
  SimpleCMP\T3SimpleCmp\Service\DraftWorkspaceService:
    public: true
  SimpleCMP\T3SimpleCmp\Service\DraftPublishService:
    public: true

  # Phase 4 — the SystemClock is the only ClockInterface implementation
  # we ship; alias the interface for autowiring. Tests inject their own
  # concrete ClockInterface bypassing the container.
  SimpleCMP\T3SimpleCmp\Service\ClockInterface: '@SimpleCMP\T3SimpleCmp\Service\SystemClock'

  # Phase 5 — effective-settings resolver: merges active_settings (DB)
  # over YAML defaults for the editor-content key list. Public so
  # consumers can `$this->get()` it directly (EventListener,
  # Middleware, Controller).
  SimpleCMP\T3SimpleCmp\Service\EffectiveSettingsResolver:
    public: true

  # --- Setup CLI ---------------------------------------------------------
  # The backend module is the only way to configure SimpleCMP, which makes
  # a rollout a sequence of clicks that cannot be reviewed, repeated or
  # scripted. These commands cover the same ground, so an environment can
  # be set up from a deployment script and a curated registry can travel
  # between installs as a reviewable JSON document.
  SimpleCMP\T3SimpleCmp\Command\StatusCommand:
    tags:
      - name: 'console.command'
        command: 'simplecmp:status'
        description: 'Report SimpleCMP setup state per site: settings bootstrap, drift, managed trackers, registry size and draft/lock state. Read-only; --json for deployment gates.'

  SimpleCMP\T3SimpleCmp\Command\AdoptSettingsCommand:
    tags:
      - name: 'console.command'
        command: 'simplecmp:adopt-settings'
        description: 'Adopt a site''s YAML banner settings as the editor-confirmed active values. Run after any deploy that changes simplecmp.* — until adopted, new values sit as drift and the old ones keep rendering.'

  SimpleCMP\T3SimpleCmp\Command\SetupTrackerCommand:
    tags:
      - name: 'console.command'
        command: 'simplecmp:setup-tracker'
        description: 'Create or update a managed tracker (GTM, GA4, Matomo, Meta, Microsoft UET) so it loads behind consent. --from-settings adopts what simplecmp.trackers proposes.'

  SimpleCMP\T3SimpleCmp\Command\AdoptServiceCommand:
    tags:
      - name: 'console.command'
        command: 'simplecmp:adopt-service'
        description: 'Adopt bundled-library services into the consent registry. --search finds a slug by vendor name.'

  SimpleCMP\T3SimpleCmp\Command\PublishCommand:
    tags:
      - name: 'console.command'
        command: 'simplecmp:publish'
        description: 'Publish a site''s staged draft and release the editing lock. Needed after commands run with --no-publish.'

  SimpleCMP\T3SimpleCmp\Command\ExportRegistryCommand:
    tags:
      - name: 'console.command'
        command: 'simplecmp:export-registry'
        description: 'Export the registry (services, managed trackers, theme, translation overrides, adopted settings) as reviewable JSON.'

  SimpleCMP\T3SimpleCmp\Command\ImportRegistryCommand:
    tags:
      - name: 'console.command'
        command: 'simplecmp:import-registry'
        description: 'Apply an exported registry document. Idempotent; adds and updates but never removes.'
