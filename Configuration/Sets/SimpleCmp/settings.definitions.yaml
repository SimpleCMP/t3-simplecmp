settings:
  simplecmp.enabled:
    label: 'Enable SimpleCMP on this site'
    description: 'Master switch. When off, the bundle is not loaded.'
    type: bool
    default: true

  simplecmp.storageName:
    label: 'Storage name'
    description: 'localStorage / cookie key the consent decision is stored under. Defaults to "simplecmp-<sitename>".'
    type: string
    default: ''

  simplecmp.privacyPolicyUrl:
    label: 'Privacy policy URL'
    description: 'Required by GDPR / DSGVO. Linked in the banner and modal.'
    type: string
    default: ''

  simplecmp.imprintUrl:
    label: 'Imprint URL (Impressum)'
    description: 'Required in Germany (TMG/MStV). Rendered as a separate link next to the privacy policy.'
    type: string
    default: ''

  simplecmp.floatingTriggerLabel:
    label: 'Floating trigger label'
    description: 'Accessible label and visible text of the persistent "cookie settings" button. Localize for non-English sites.'
    type: string
    default: 'Cookie settings'

  simplecmp.respectGPC:
    label: 'Respect Global Privacy Control'
    description: 'When the browser signals GPC, default all non-required services to opt-out on first visit.'
    type: bool
    default: true

  simplecmp.regimeDefault:
    label: 'Default consent regime'
    description: 'How the banner behaves when no region override applies. "opt-in" (GDPR/EU) shows a blocking consent banner and defaults non-required services off. "opt-out" (US/CCPA) shows a non-blocking notice with a "Do Not Sell or Share" control and defaults services on until the visitor opts out. "none" shows no auto-banner. Allowed: opt-in | opt-out | none.'
    type: string
    default: 'opt-in'

  simplecmp.regionHeader:
    label: 'Region HTTP header (optional)'
    description: 'Name of the request header carrying the visitor''s country/region code (e.g. "CF-IPCountry" from Cloudflare, or an edge/GeoIP header). When set, EU codes resolve to opt-in and US to opt-out automatically, overriding the default regime per visitor. Leave empty to apply the default regime to everyone. SimpleCMP never geo-locates client-side.'
    type: string
    default: ''

  simplecmp.serviceDbUrl:
    label: 'Service DB endpoint URL (optional)'
    description: 'Base URL of a Service DB that implements the SimpleCMP protocol. The JS client appends the protocol version itself, so do not include `/v1` — example: `https://example.com/api/simplecmp` (client will hit `https://example.com/api/simplecmp/v1/lookup`). A trailing `/v1` is auto-stripped at render time and logged as a warning; trailing slashes are normalized. Leave empty to use only the local services list.'
    type: string
    default: ''

  simplecmp.cmsBridgeUrl:
    label: 'CMS bridge webhook URL (optional)'
    description: 'POST target for unknown-tracker alerts in production. Leave empty to disable.'
    type: string
    default: ''

  simplecmp.storagePid:
    label: 'Storage page ID for service + detection records'
    description: 'TYPO3 page UID under which new `tx_t3simplecmp_service` and `tx_t3simplecmp_detection` rows are created (typically a dedicated SysFolder). Defaults to 0 (site root). Records created before changing this setting are NOT moved.'
    type: int
    default: 0

  simplecmp.bridgeRateLimit:
    label: 'Bridge webhook rate limit (requests per IP per hour)'
    description: 'Maximum number of /api/simplecmp/webhook POSTs accepted from a single IP within a sliding 1-hour bucket. Set to 0 to disable. Default 500 comfortably covers a normal visitor session (most sites generate 20-30 unique detections per visit).'
    type: int
    default: 500

  simplecmp.serviceDbRateLimit:
    label: 'Service-DB lookup rate limit (requests per IP per hour)'
    description: 'Maximum number of /api/simplecmp/v1/lookup requests accepted from a single IP within a sliding 1-hour bucket. This is the public classifier endpoint the frontend hits on a local miss, so the default is high (5000) to stay invisible to real visitors and tolerant of shared NAT/CGNAT IPs while still capping a single-IP flood. Counted separately from the webhook limit. Set to 0 to disable.'
    type: int
    default: 5000

  simplecmp.universalBlocking.enabled:
    label: 'Universal pre-consent blocking'
    description: 'When on, the FE pipeline rewrites every third-party <script src> / <iframe src> / <img src> / <link href> on the page to the engine''s data-name + data-src + src="about:blank" gate shape before the response is flushed. Visitors then see the click-to-enable placeholder for each blocked embed until consent is granted. Recognises hosts via the bundled simplecmp/services-library origin matchers. On by default — turn off only if your site is fully self-hosted and embeds nothing third-party. See ADR-0013 for the design.'
    type: bool
    default: true

  simplecmp.universalBlocking.blockStylesheets:
    label: 'Also block third-party stylesheets (opt-in, best-effort)'
    description: 'When on (and universal blocking is enabled), the rewriter also gates third-party <link rel="stylesheet"> (e.g. Google Fonts at fonts.googleapis.com) — moving the href to data-href so the browser never loads it pre-consent; the engine reinjects it on consent. OFF by default and deliberately so: the honest fix for third-party fonts/CSS is SELF-HOSTING. This is best-effort, not "now compliant" — the browser preload-scanner can fetch a stylesheet before the rewriter intervenes, and @import url(...) inside a stylesheet escapes entirely. After turning this on, run Tracker entdecken (Discover) to see which stylesheets are now blocked and allow the ones you need (add their host to the allowlist) or self-host them.'
    type: bool
    default: false

  simplecmp.libraryUpstreamUrl:
    label: 'Library service upstream URL'
    description: 'Base URL of the canonical SimpleCMP services-library endpoint (including the `/v1` version segment). When set, ClassifierLookup queries this server as a third tier after the registry and bundled library both miss — so newly-added trackers get classified correctly without waiting for a composer-update to refresh the bundled snapshot. Visitor IPs never reach this URL; only this server queries it (server-to-server). Responses are cached locally for 24h (both positive and negative). On by default — set to empty string to disable upstream and use only the bundled library that ships with the extension.'
    type: string
    default: 'https://library.simplecmp.eu/v1'

  simplecmp.libraryUpstreamDailyBudget:
    label: 'Library upstream daily call budget'
    description: 'Maximum number of upstream library calls allowed per UTC day. Cache hits are free and never count against this budget — only fresh lookups (cache miss + URL configured) consume the budget. When today''s count reaches this value, further misses skip the upstream silently (the cookie stays classified as unknown for the day; the bundled library still matches what it can). Set to 0 to disable the budget (unlimited calls). Default 5000 covers most sites comfortably; a busy public site with thousands of unique third-party cookies per day might raise it.'
    type: int
    default: 5000

  simplecmp.universalBlocking.allowlist:
    label: 'Universal blocking host allowlist'
    description: 'Hosts the rewriter should pass through without gating, in addition to the site''s own host. One per line. Exact match (e.g. `cdn.example.com`) or wildcard form `*.example.com` matching the apex + every subdomain. The site''s own host is always allowlisted automatically. Use this for vendor CDNs, your own infrastructure, or known-safe hosts you don''t want to surface as consent decisions.'
    type: stringlist
    default: []

  simplecmp.useSlimBundle:
    label: 'Use slim English-only bundle + inject site language pack (ADR-0018)'
    description: 'When on, t3-simplecmp loads `simplecmp.core.global.js` (English-only, ~15–20 KB gzip lighter than the full bundle) and injects only the active site language''s translation pack via `config.translations`. Requires `simplecmp.core.global.js` and `translations/<lang>.json` files to be present in `EXT:t3_simplecmp/Resources/Public/JavaScript/` — see README "Slim bundle (ADR-0018)" for the sync workflow. When the slim bundle file is missing the extension falls back to the full bundle automatically and logs a warning; when a per-language pack is missing the engine''s English fallback applies. OFF by default for back-compat.'
    type: bool
    default: false

# `simplecmp.trackers` is intentionally NOT defined here — TYPO3
# site-setting types are scalar only (string, int, bool, stringlist,
# url, …), there is no nested-array type that the BE form module
# could render. The setting is still readable at runtime via
# `$site->getSettings()->get('simplecmp.trackers')`, so integrators
# add it directly in `config/sites/<id>/settings.yaml`:
#
#   simplecmp:
#     trackers:
#       - type: matomo
#         url: https://matomo.example.com/
#         siteId: 99
#       - type: ga4
#         measurementId: G-XXXXXXXXXX
#       - type: gtm
#         containerId: GTM-XXXXXXX
#
# The TrackerMaterializer event listener (see Classes/EventListener)
# upserts a `tx_t3simplecmp_service` row per entry, registers the
# loader script with `data-name="<service_id>"`, and emits the
# bootstrap inline JS. Origins flow into the CSP via CspPolicyMutator.
