settings:
  simplecmp.enabled:
    label: 'Enable SimpleCMP on this site'
    description: 'Master switch. When off, the bundle is not loaded.'
    type: bool
    default: true

  simplecmp.storageName:
    label: 'Storage name'
    description: 'localStorage / cookie key the consent decision is stored under. Defaults to "simplecmp-<sitename>".'
    type: string
    default: ''

  simplecmp.privacyPolicyUrl:
    label: 'Privacy policy URL'
    description: 'Required by GDPR / DSGVO. Linked in the banner and modal.'
    type: string
    default: ''

  simplecmp.imprintUrl:
    label: 'Imprint URL (Impressum)'
    description: 'Required in Germany (TMG/MStV). Rendered as a separate link next to the privacy policy.'
    type: string
    default: ''

  simplecmp.floatingTriggerLabel:
    label: 'Floating trigger label'
    description: 'Accessible label and visible text of the persistent "cookie settings" button. Localize for non-English sites.'
    type: string
    default: 'Cookie settings'

  simplecmp.respectGPC:
    label: 'Respect Global Privacy Control'
    description: 'When the browser signals GPC, default all non-required services to opt-out on first visit.'
    type: bool
    default: true

  simplecmp.serviceDbUrl:
    label: 'Service DB endpoint URL (optional)'
    description: 'Base URL of a Service DB that implements the SimpleCMP protocol. The JS client appends the protocol version itself, so do not include `/v1` — example: `https://example.com/api/simplecmp` (client will hit `https://example.com/api/simplecmp/v1/lookup`). A trailing `/v1` is auto-stripped at render time and logged as a warning; trailing slashes are normalized. Leave empty to use only the local services list.'
    type: string
    default: ''

  simplecmp.cmsBridgeUrl:
    label: 'CMS bridge webhook URL (optional)'
    description: 'POST target for unknown-tracker alerts in production. Leave empty to disable.'
    type: string
    default: ''

  simplecmp.storagePid:
    label: 'Storage page ID for service + detection records'
    description: 'TYPO3 page UID under which new `tx_t3simplecmp_service` and `tx_t3simplecmp_detection` rows are created (typically a dedicated SysFolder). Defaults to 0 (site root). Records created before changing this setting are NOT moved.'
    type: int
    default: 0

  simplecmp.bridgeRateLimit:
    label: 'Bridge webhook rate limit (requests per IP per hour)'
    description: 'Maximum number of /api/simplecmp/webhook POSTs accepted from a single IP within a sliding 1-hour bucket. Set to 0 to disable. Default 500 comfortably covers a normal visitor session (most sites generate 20-30 unique detections per visit).'
    type: int
    default: 500

  simplecmp.universalBlocking.enabled:
    label: 'Universal pre-consent blocking'
    description: 'When on, the FE pipeline rewrites every third-party <script src> / <iframe src> / <img src> / <link href> on the page to the engine''s data-name + data-src + src="about:blank" gate shape before the response is flushed. Visitors then see the click-to-enable placeholder for each blocked embed until consent is granted. Recognises hosts via the bundled simplecmp/services-library origin matchers. On by default — turn off only if your site is fully self-hosted and embeds nothing third-party. See ADR-0013 for the design.'
    type: bool
    default: true

  simplecmp.universalBlocking.allowlist:
    label: 'Universal blocking host allowlist'
    description: 'Hosts the rewriter should pass through without gating, in addition to the site''s own host. One per line. Exact match (e.g. `cdn.example.com`) or wildcard form `*.example.com` matching the apex + every subdomain. The site''s own host is always allowlisted automatically. Use this for vendor CDNs, your own infrastructure, or known-safe hosts you don''t want to surface as consent decisions.'
    type: stringlist
    default: []
