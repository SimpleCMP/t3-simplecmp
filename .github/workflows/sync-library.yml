name: Sync upstream services-library

# Receives `repository_dispatch` from SimpleCMP/services-library when
# its CI passes on main. Clones services-library at the dispatched
# SHA, mirrors the loader + 368 JSON data files into the ext, writes
# the SOURCE.json sidecar, runs the PHPUnit gates, and either commits
# directly to release/v14 (all green) or opens a failure PR labelled
# `needs-triage` with reviewers requested.
#
# Phase 2 of the services-library vendoring story — see the project
# memory at memory/library_vendoring.md for the full architecture +
# rationale.
#
# Required secrets / labels are shared with sync-bundle.yml:
# - Workflow permissions: Read+write (Settings → Actions → General)
# - Label `needs-triage` (created during the bundle-sync rollout)

on:
  repository_dispatch:
    types: [library-sync]
  workflow_dispatch:
    inputs:
      upstream_sha:
        description: services-library SHA to sync from
        required: true
        type: string

concurrency:
  group: sync-library
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM_SHA: ${{ github.event.client_payload.upstream_sha || inputs.upstream_sha }}
  UPSTREAM_URL: ${{ github.event.client_payload.upstream_url || '' }}
  LOADER_REL: Classes/Library/ServicesLibrary.php
  DATA_REL: Resources/Private/ServicesLibrary/data/services
  SOURCE_REL: Resources/Private/ServicesLibrary/SOURCE.json
  TRIAGE_REVIEWERS: ille216,svewap

jobs:
  sync:
    name: Mirror + verify + push
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: func_simplecmp
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      typo3DatabaseDriver: mysqli
      typo3DatabaseHost: 127.0.0.1
      typo3DatabaseUsername: root
      typo3DatabasePassword: root
      typo3DatabaseName: func_simplecmp
    steps:
      - name: Checkout ext (release/v14)
        uses: actions/checkout@v6
        with:
          ref: release/v14
          fetch-depth: 0

      - name: Resolve upstream SHA to full 40-char form
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # actions/checkout's `ref:` requires either a branch/tag name OR
          # a full 40-char SHA. A short SHA gets misinterpreted as a branch
          # pattern. Resolve via the commits API so workflow_dispatch input
          # can accept short SHAs.
          FULL=$(gh api repos/SimpleCMP/services-library/commits/${UPSTREAM_SHA} --jq .sha)
          if [ -z "$FULL" ] || [ "${#FULL}" -ne 40 ]; then
            echo "::error::Could not resolve $UPSTREAM_SHA to a full SHA"
            exit 1
          fi
          echo "Resolved $UPSTREAM_SHA → $FULL"
          echo "full_sha=$FULL" >> "$GITHUB_OUTPUT"

      - name: Checkout services-library at dispatched SHA
        uses: actions/checkout@v6
        with:
          repository: SimpleCMP/services-library
          ref: ${{ steps.resolve.outputs.full_sha }}
          path: _upstream
          fetch-depth: 0   # needed for the tag lookup below

      - name: Mirror loader with namespace rewrite
        run: |
          SRC=_upstream/src/ServicesLibrary.php
          test -f "$SRC" || { echo "::error::Loader missing at $SRC"; exit 1; }
          mkdir -p "$(dirname "$LOADER_REL")"
          # Two surgical rewrites: namespace declaration + dataPath() body.
          # Everything else (services(), dataHash(), flattenAliasOrigins())
          # copies verbatim — the loader's API contract is stable.
          sed -e 's|^namespace SimpleCMP\\ServicesLibrary;|namespace SimpleCMP\\T3SimpleCmp\\Library;|' \
              -e "s|return dirname(__DIR__) \. '/data/services';|return dirname(__DIR__, 2) . '/Resources/Private/ServicesLibrary/data/services';|" \
              "$SRC" > "$LOADER_REL"
          # Verify rewrites actually landed — sed silently no-ops on
          # missed patterns, which would ship a class with the wrong
          # namespace.
          grep -q 'namespace SimpleCMP\\T3SimpleCmp\\Library;' "$LOADER_REL" \
            || { echo "::error::Namespace rewrite did not match — upstream loader shape may have changed"; exit 1; }
          grep -q "dirname(__DIR__, 2) . '/Resources/Private/ServicesLibrary/data/services'" "$LOADER_REL" \
            || { echo "::error::dataPath() rewrite did not match — upstream loader shape may have changed"; exit 1; }

      - name: Mirror JSON service files
        run: |
          SRC_DIR=_upstream/data/services
          test -d "$SRC_DIR" || { echo "::error::Data dir missing at $SRC_DIR"; exit 1; }
          # Rsync with --delete so removed-upstream services drop out of
          # the ext too. Filter on *.json so _imported/ subdir (curation
          # staging) doesn't bleed in.
          mkdir -p "$DATA_REL"
          rsync -a --delete --include='*.json' --exclude='*' \
            "$SRC_DIR/" "$DATA_REL/"
          COUNT=$(find "$DATA_REL" -maxdepth 1 -name '*.json' | wc -l)
          echo "Mirrored $COUNT services"
          if [ "$COUNT" -lt 300 ]; then
            echo "::error::Suspiciously few services after mirror ($COUNT); expected ~368"
            exit 1
          fi

      - name: Write SOURCE.json sidecar
        run: |
          cd _upstream
          # Resolve a human-readable version label: an annotated/lightweight
          # tag pointing exactly at the synced SHA, else `dev-<branch>` from
          # the dispatch payload, else `dev-unknown`.
          TAG=$(git tag --points-at HEAD | head -1)
          if [ -n "$TAG" ]; then
            VERSION="$TAG"
          else
            VERSION="dev-main"
          fi
          SYNCED_AT=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          cd - > /dev/null
          cat > "$SOURCE_REL" <<EOF
          {
              "version": "$VERSION",
              "sha": "${{ steps.resolve.outputs.full_sha }}",
              "syncedAt": "$SYNCED_AT"
          }
          EOF
          echo "SOURCE.json:"
          cat "$SOURCE_REL"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysqli
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-8.4-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-8.4-

      - name: Composer install
        run: composer install --no-progress --prefer-dist --no-interaction

      - name: PHPUnit unit suite
        run: composer test:unit

      - name: PHPUnit functional suite
        run: composer test:functional

      - name: Compose commit message
        id: msg
        run: |
          SHORT=${UPSTREAM_SHA::7}
          # Find the previous library-sync commit on this branch (HEAD~ scan)
          # to bound the changelog range. First-ever sync just lists the
          # dispatched commit's subject.
          LAST_SYNC_HASH=$(git log --grep='chore(library): sync upstream' -n 1 --format=%H || true)
          LAST_UPSTREAM_SHA=""
          if [ -n "$LAST_SYNC_HASH" ]; then
            LAST_UPSTREAM_SHA=$(git show -s --format=%B "$LAST_SYNC_HASH" | grep -oE 'SimpleCMP/services-library@[0-9a-f]{7,40}' | head -1 | sed 's|.*@||')
          fi
          if [ -n "$LAST_UPSTREAM_SHA" ]; then
            CHANGES=$(cd _upstream && git log --no-merges --format='- %s' "${LAST_UPSTREAM_SHA}..${UPSTREAM_SHA}" 2>/dev/null || true)
          fi
          if [ -z "${CHANGES:-}" ]; then
            CHANGES=$(cd _upstream && git log -1 --format='- %s' "$UPSTREAM_SHA")
          fi
          {
            echo "message<<MSG_EOF"
            echo "chore(library): sync upstream — $SHORT"
            echo
            echo "Upstream commits since last sync:"
            echo
            echo "$CHANGES"
            echo
            echo "Built from SimpleCMP/services-library@$UPSTREAM_SHA"
            echo "MSG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Commit + push to release/v14
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage everything under the vendored paths plus the loader +
          # SOURCE.json. Anything else (e.g. _upstream/) is untracked
          # since it's not in the repo's gitignore-allowed paths.
          git add "$LOADER_REL" "$DATA_REL" "$SOURCE_REL"
          if git diff --cached --quiet; then
            echo "No library changes to commit (identical to current)"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "${{ steps.msg.outputs.message }}"
          git push origin HEAD:release/v14

      # On any failure above, open a PR carrying whatever state we got
      # to, labelled needs-triage with reviewers requested.
      - name: Open failure PR
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT=${UPSTREAM_SHA::7}
          BRANCH="library-sync/upstream-${SHORT}-failed-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          if ! git diff --quiet -- "$LOADER_REL" "$DATA_REL" "$SOURCE_REL"; then
            git add "$LOADER_REL" "$DATA_REL" "$SOURCE_REL"
            git commit -m "chore(library): FAILED sync from upstream@${SHORT}"
          else
            git commit --allow-empty -m "chore(library): FAILED sync from upstream@${SHORT} (no library state changes produced)"
          fi
          git push origin "$BRANCH"
          BODY=$(cat <<EOF
          Automated services-library sync from upstream commit \`${UPSTREAM_SHA}\` failed before reaching \`release/v14\`.

          - **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - **Upstream commit:** ${UPSTREAM_URL:-https://github.com/SimpleCMP/services-library/commit/$UPSTREAM_SHA}

          Triage steps:

          1. Open the workflow run linked above and identify the failing step.
          2. If the failure is an upstream issue (data schema invalid, loader API drifted, etc.) — close this PR and let the next upstream push re-trigger the sync. Or push a fix to services-library and re-dispatch via workflow_dispatch.
          3. If the failure is an integration issue between upstream + ext (PHP contract drift, etc.) — push a fix to this branch; CI will re-run; merge when green.

          This PR was opened automatically by the \`sync-library\` workflow.
          EOF
          )
          gh pr create \
            --title "[library-sync FAILED] upstream ${SHORT}" \
            --body "$BODY" \
            --label "needs-triage" \
            --reviewer "$TRIAGE_REVIEWERS" \
            --base release/v14 \
            --head "$BRANCH"
