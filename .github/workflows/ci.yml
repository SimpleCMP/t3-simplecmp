name: CI

on:
  push:
    branches: [release/v12]
  pull_request:
    branches: [release/v12]

# Every public TYPO3 12.4 release carries a Packagist security advisory
# (12 continues as ELTS only), so Composer refuses to resolve it by
# default. The CI installs it anyway to test against.
env:
  COMPOSER_NO_SECURITY_BLOCKING: '1'

jobs:
  unit:
    name: PHPUnit unit (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ matrix.php-version }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ matrix.php-version }}-

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --no-interaction

      - name: Run unit tests
        run: composer test:unit

  functional:
    name: PHPUnit functional (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3']
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: func_simplecmp
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      typo3DatabaseDriver: mysqli
      typo3DatabaseHost: 127.0.0.1
      typo3DatabaseUsername: root
      typo3DatabasePassword: root
      typo3DatabaseName: func_simplecmp
    steps:
      - uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mysqli
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ matrix.php-version }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ matrix.php-version }}-

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --no-interaction

      - name: Run functional tests
        run: composer test:functional

  docs:
    name: Render documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Renders the manual with the official TYPO3 render-guides container
      # and fails on any ERROR-level log (broken reST, unresolved includes,
      # an unparseable guides.xml — the class of breakage PHPUnit can't see,
      # since docs render in a separate pipeline). `--fail-on-error` (not
      # `--fail-on-log`) so the benign "Sitemap/genindex menu entry not
      # found" WARNINGs don't false-fail the build.
      - name: Render documentation
        run: |
          docker run --rm --pull always -v "${{ github.workspace }}":/project \
            ghcr.io/typo3-documentation/render-guides:latest \
            --config=Documentation --no-progress --fail-on-error
